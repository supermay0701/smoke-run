  ctx.strokeStyle = done ? rank.color : '#aaa'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.stroke();
  if (!done) ctx.globalAlpha = 0.5;
  emoji(done ? a.icon : (secret ? '❓' : '🔒'), cx, cy + 1, 26);
  ctx.globalAlpha = 1;
  const tx = x + 72, tw = w - 154;
  txt(secret ? '？？？' : a.name, tx, y + 19, 16, done ? '#222' : '#777', 'left');
  ctx.fillStyle = done ? rank.color : '#adb5bd'; rr(x + w - 76, y + 8, 66, 20, 10); ctx.fill();
  txt(`${rank.name} +${a.points}`, x + w - 43, y + 18, 10, '#fff');
  wrapText(secret ? '隱藏成就，自己去發現吧' : a.desc, tw + 68, 12).slice(0, 1)
    .forEach(l => txt(l, tx, y + 42, 12, done ? '#5c5140' : '#999', 'left', 'normal'));
  if (isNew) {
    ctx.fillStyle = '#e03131'; rr(x + w - 50, y - 8, 52, 22, 11); ctx.fill();
    txt('NEW!', x + w - 24, y + 3, 12, '#fff');
  }
}

function drawToasts() {
  const t = toasts[0];
  if (!t) return;
  const age = TOAST_T - t.life;
  // 從上方彈下來，帶一點回彈
  let k = Math.min(1, age / 0.35);
  k = 1 - Math.pow(1 - k, 3) * Math.cos(k * 4);
  const out = Math.min(1, t.life / 0.3);
  const w = 360, h = 84, x = (W - w) / 2, y = -h + (h + (G && G.tut ? 230 : 104)) * k * out;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(x + 3, y + 5, w, h, 16); ctx.fill();
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#fff3bf'); g.addColorStop(1, '#ffd43b');
  ctx.fillStyle = g; rr(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 3; ctx.stroke();
  // 閃光
  ctx.save(); rr(x, y, w, h, 16); ctx.clip();
  const sx = x - 80 + ((age * 380) % (w + 200));
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 30, y); ctx.lineTo(sx - 10, y + h); ctx.lineTo(sx - 40, y + h); ctx.fill();
  ctx.restore();
  const pulse = 1 + Math.sin(age * 10) * 0.06;
  ctx.fillStyle = '#fff'; circle(x + 44, y + h / 2, 30);
  ctx.strokeStyle = '#c77700'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 44, y + h / 2, 30, 0, Math.PI * 2); ctx.stroke();
  emoji(t.a.icon, x + 44, y + h / 2 + 1, 32 * pulse);
  const rank = ACH_RANKS[t.a.rank];
  txt(`🏆 成就解鎖 · ${rank.name} +${t.a.points}`, x + 86, y + 24, 14, rank.color, 'left');
  txt(t.a.name, x + 86, y + 52, 24, '#222', 'left');
  if (toasts.length > 1) {
    ctx.fillStyle = '#e03131'; rr(x + w - 44, y - 10, 48, 24, 12); ctx.fill();
    txt(`+${toasts.length - 1}`, x + w - 20, y + 2, 13, '#fff');
  }
  ctx.restore();
}

function drawEndingIntro() {
  const e = G.ending || endingFor(G.over), t = G.overT;
  ctx.save();
  ctx.fillStyle = e.bg; ctx.fillRect(0, 0, W, H);

  // 緩慢移動的警示斜紋，先讓玩家停下來看清楚結束原因。
  ctx.globalAlpha = .11;
  ctx.strokeStyle = e.color; ctx.lineWidth = 24;
  const off = (t * 34) % 70;
  for (let x = -H + off; x < W + H; x += 70) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - H, H); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const appear = clamp(t / .35, 0, 1), pulse = 1 + Math.sin(t * 5) * .025;
  ctx.save(); ctx.translate(W / 2, 235); ctx.scale(appear * pulse, appear * pulse);
  ctx.fillStyle = 'rgba(255,255,255,.1)'; circle(0, 0, 82);
  emoji(e.icon, 0, 0, 92);
  ctx.restore();

  txt('本局結局', W / 2, 76, 17, '#adb5bd', 'center', 'normal');
  const titleLines = wrapText(e.title, W - 54, 35).slice(0, 2);
  titleLines.forEach((line, i) => txtS(line, W / 2, 352 + i * 42, 35, '#fff', 'center', e.color));
  const dy = 352 + titleLines.length * 42 + 10;
  wrapText(e.detail, W - 70, 16).slice(0, 2)
    .forEach((line, i) => txt(line, W / 2, dy + i * 23, 16, '#f1f3f5', 'center', 'normal'));

  const ry = dy + 68;
  ctx.fillStyle = 'rgba(0,0,0,.42)'; rr(34, ry, W - 68, 88, 14); ctx.fill();
  ctx.strokeStyle = e.color; ctx.lineWidth = 2.5; ctx.stroke();
  txt('觸發原因', W / 2, ry + 22, 14, e.color);
  wrapText(e.trigger, W - 100, 16).slice(0, 2)
    .forEach((line, i) => txt(line, W / 2, ry + 50 + i * 21, 16, '#fff', 'center', 'normal'));

  const progress = clamp(t / 2.2, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(70, H - 86, W - 140, 7, 4); ctx.fill();
  ctx.fillStyle = e.color; rr(70, H - 86, Math.max(8, (W - 140) * progress), 7, 4); ctx.fill();
  if (t > .7) {
    txt('點一下查看完整結算', W / 2, H - 48, 14, '#ced4da', 'center', 'normal');
    button(0, 0, W, H, () => { G.overT = 2.2; });
  }
  ctx.restore();
}

function drawOver() {
  if (G.overT < 2.2) { drawEndingIntro(); return; }
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, W, H);
  const quit = G.over === 'quit';
  const x = 20, y = 14, w = W - 40, h = 772;
  panel(x, y, w, h, quit ? '#f0fff4' : '#fffaf0');

  const ending = G.ending || endingFor(G.over);
  const C = CHARS.find(c => c.id === G.char) || CHARS[0];
  txt(`${ending.icon} ${ending.title}`, W / 2, y + 36, 26, quit ? '#2b8a3e' : '#c1121f');
  txt(ending.detail, W / 2, y + 68, 14, '#555', 'center', 'normal');
  txt(`${C.icon} ${C.name} · ${D.icon} ${D.name} · 存活 ${Math.floor(G.t)} 秒 · 生涯爽度 +${fmt(G.careerGain)}`, W / 2, y + 88, 11, '#888');
  const unlockText = G.newChars?.length ? ` · 🔓 解鎖${G.newChars.map(c => c.name).join('、')}` : '';
  txt(`${G.bystandersFled ? `😷 ${G.bystandersFled} 人逃離二手菸` : '😷 沒有路人逃離'}${G.newBest ? ' · 🎊 角色新紀錄！' : ''}${unlockText}`, W / 2, y + 103, 11, G.newChars?.length || G.newBest ? '#e67700' : '#999');

  if (lbOn()) {
    const l = G.lb, s = !player.name ? '' : !l ? '' : l.st === 'up' ? '上傳中…' : l.st === 'err' ? '上傳失敗' : `${C.name}第 ${l.rank} 名`;

    }
  }

  // 數據（兩欄）
  const total = G.cigMoney + G.fines + G.hospCost;
  const mins = G.cigs * CFG.minPerCig;
  const life = mins < 60 ? `${mins} 分鐘` : mins < 1440 ? `${(mins / 60).toFixed(1)} 小時` : `${(mins / 1440).toFixed(1)} 天`;
  const stats = [

    ['💰 菸錢', `$${fmt(G.cigMoney)}`], ['🚓 罰款', `$${fmt(G.fines)}`],
    ['🏥 醫藥費', `$${fmt(G.hospCost)}`], ['⏳ 少活', life],

  const na = G.newAch;
  const ay = y + 320, pageSize = 2, pages = Math.max(1, Math.ceil(na.length / pageSize));
  overAchPage = clamp(overAchPage, 0, pages - 1);
  txt(`🏆 新成就介紹${na.length ? `（${na.length}）` : ''}`, x + 22, ay, 17, '#b35c00', 'left');
  if (pages > 1) {
    btn(x + w - 102, ay - 13, 32, 28, '◀', '#868e96', () => overAchPage = (overAchPage + pages - 1) % pages, 13);
    btn(x + w - 62, ay - 13, 32, 28, '▶', '#868e96', () => overAchPage = (overAchPage + 1) % pages, 13);
    txt(`${overAchPage + 1}/${pages}`, x + w - 118, ay + 1, 11, '#999', 'right', 'normal');
  }
  if (!na.length) {
    ctx.fillStyle = '#f1f1ee'; rr(x + 20, ay + 16, w - 40, 56, 12); ctx.fill();
    txt('這局沒有新成就，換個角色或試著無菸通過禁菸區。', W / 2, ay + 44, 13, '#777', 'center', 'normal');
  } else {
    const show = na.slice(overAchPage * pageSize, (overAchPage + 1) * pageSize);
    show.forEach((a, i) => {
      const pop = clamp((G.overT - 2.35 - i * 0.25) / 0.25, 0, 1);
      if (pop <= 0) return;
      ctx.save();
      const cy = ay + 20 + i * 76;
      ctx.translate(W / 2, cy + 32); ctx.scale(0.6 + pop * 0.4, 0.6 + pop * 0.4); ctx.globalAlpha = pop;
      achCard(a, -(w - 40) / 2, -32, w - 40, 64, true, true);
      ctx.restore();
    });
  }

  // 底部固定區
  const by = y + h - 228;
  txt(quit ? '這次是遊戲，下次可以是真的。' : `⚠️ ${G.healthFact}`, W / 2, by - 6, 13, quit ? '#2b8a3e' : '#c1121f', 'center', 'normal');
  txt(quit ? `v${GAME_VERSION}` : `資料：WHO／國民健康署　·　v${GAME_VERSION}`, W / 2, by + 10, 9, '#868e96', 'center', 'normal');
  ctx.fillStyle = quit ? '#2b8a3e' : '#222'; rr(x + 20, by + 18, w - 40, 64, 12); ctx.fill();
  txt('想真的戒？免費戒菸專線', W / 2, by + 38, 13, '#ddd', 'center', 'normal');
  txt('📞 0800-636363', W / 2, by + 64, 22, '#fff');

  if (G.overT > 2.6) {
    btn(x + 20, by + 100, w - 40, 54, '▶ 再跑一局', '#e03131', newGame, 22);
    const tw = (w - 40 - 16) / 3;
    btn(x + 20, by + 166, tw, 42, `🏆 ${fmt(achPoints())}分`, '#ffd23f', openAch, 15, '#222');
    btn(x + 28 + tw, by + 166, tw, 42, '📊 排行榜', '#4dabf7', () => openLB('over'), 15);
    btn(x + 36 + tw * 2, by + 166, tw, 42, '🏠 首頁', '#868e96', () => { state = 'title'; }, 15);
  }
}

// ====== 主迴圈 ======
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (state === 'title' || state === 'ach' || state === 'lb') bgOff = (bgOff + 120 * dt) % 80;
  else if (state === 'play') update(dt);
  else if (state === 'over') G.overT += dt;
  musicTick();

  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  btns = [];
  if (state === 'title') drawTitle();
  else if (state === 'ach') drawAchScreen();
  else if (state === 'lb') drawLeaderboard();
  else {
    drawWorld(); drawHUD();
    if (state === 'play' && G.tut) drawTutorial();
    drawToasts();
    if (state === 'pause') drawPause();
    if (state === 'over') drawOver();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

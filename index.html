<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>菸槍快跑！</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #nameBox { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.65); z-index: 10; font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; }
  #nameBox[hidden] { display: none; }
  #nameBox .card { width: min(340px, 86vw); background: #fffaf0; border: 3px solid #2b2b2b; border-radius: 18px; padding: 22px 20px 18px; box-shadow: 4px 6px 0 rgba(0,0,0,.35); text-align: center; }
  #nameBox h3 { margin: 0 0 6px; font-size: 22px; color: #1864ab; }
  #nameBox p { margin: 0 0 14px; font-size: 14px; color: #666; }
  #nameBox input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 10px 12px; border: 2px solid #adb5bd; border-radius: 12px; text-align: center; user-select: text; -webkit-user-select: text; outline: none; font-family: inherit; }
  #nameBox input:focus { border-color: #1c7ed6; }
  #nameBox .err { min-height: 20px; margin: 8px 0 4px; font-size: 13px; color: #e03131; }
  #nameBox .row { display: flex; gap: 10px; }
  #nameBox button { flex: 1; font-size: 17px; font-weight: bold; padding: 11px 0; border: 2.5px solid #2b2b2b; border-radius: 24px; cursor: pointer; font-family: inherit; }
  #nameOk { background: #1c7ed6; color: #fff; }
  #nameCancel { background: #dee2e6; color: #333; }
  #nameBox button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="nameBox" hidden>
  <div class="card">
    <h3>📊 輸入暱稱</h3>
    <p>上排行榜用，最多 12 個字，不用註冊帳號</p>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="例如：老菸槍阿明">
    <div class="err" id="nameErr"></div>
    <div class="row"><button id="nameCancel">取消</button><button id="nameOk">確定</button></div>
  </div>
</div>
<script>
'use strict';

// ====== 基本設定 ======
const W = 450, H = 800;
const GAME_VERSION = '1.1.0-beta.3';
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('en-US');
const now = () => performance.now() / 1000;

// ====== 聲音（Web Audio 程序生成，不使用外部音樂素材） ======
const soundPrefs = {
  music: localStorage.getItem('smokerun_music') !== '0',
  sfx: localStorage.getItem('smokerun_sfx') !== '0',
};
const AUDIO = { ctx: null, next: 0, step: 0 };
function ensureAudio() {
  if (!AUDIO.ctx) AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
  return AUDIO.ctx;
}
function tone(freq, dur = .12, type = 'sine', vol = .035, delay = 0) {
  if (!AUDIO.ctx) return;
  const ac = AUDIO.ctx, at = ac.currentTime + delay;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, at);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), at + .015);
  gain.gain.exponentialRampToValueAtTime(.0001, at + dur);
  osc.connect(gain).connect(ac.destination); osc.start(at); osc.stop(at + dur + .03);
}
function sfx(kind) {
  if (!soundPrefs.sfx) return;
  ensureAudio();
  const map = {
    smoke: [[170, .11, 'sawtooth', .025], [120, .16, 'triangle', .018, .05]],
    money: [[660, .09, 'square', .025], [880, .12, 'triangle', .02, .07]],
    hit: [[95, .25, 'sawtooth', .045], [62, .3, 'square', .025, .04]],
    heal: [[440, .12, 'sine', .025], [660, .18, 'sine', .025, .1]],
    cat: [[880, .08, 'triangle', .03], [1175, .13, 'sine', .025, .08]],
    weed: [[220, .4, 'sine', .025], [330, .5, 'sine', .02, .12], [495, .6, 'sine', .018, .25]],
    ach: [[660, .1, 'triangle', .028], [880, .12, 'triangle', .028, .1], [1320, .2, 'sine', .025, .2]],
    zone: [[523, .1, 'triangle', .025], [784, .18, 'sine', .025, .08]],
    click: [[420, .06, 'square', .018]],
  };
  (map[kind] || map.click).forEach(v => tone(...v));
}
function musicTick() {
  if (!soundPrefs.music || !AUDIO.ctx || state !== 'play') return;
  const ac = AUDIO.ctx, speedMix = G.speedMix || 0;
  const beat = 60 / (88 + speedMix * 62) / 2;
  if (!AUDIO.next || AUDIO.next < ac.currentTime - .2) AUDIO.next = ac.currentTime + .03;
  const scale = G.weed > 0 ? [220, 277, 330, 415, 494, 554, 659, 831] : [220, 262, 294, 330, 392, 440, 523, 587];
  while (AUDIO.next < ac.currentTime + .1) {
    const i = AUDIO.step++;
    const note = scale[(i * 3 + Math.floor(G.t / 20)) % scale.length];
    tone(note, beat * .72, G.weed > 0 ? 'sine' : 'triangle', .012 + speedMix * .006, AUDIO.next - ac.currentTime);
    if (i % 4 === 0) tone(scale[(i / 4 | 0) % 4] / 2, beat * 2.4, 'sine', .022, AUDIO.next - ac.currentTime);
    if (G.t > 45 && i % 2 === 1) tone(note * 2, beat * .24, 'square', .005, AUDIO.next - ac.currentTime);
    AUDIO.next += beat;
  }
}
function toggleSound(key) {
  soundPrefs[key] = !soundPrefs[key];
  localStorage.setItem(`smokerun_${key}`, soundPrefs[key] ? '1' : '0');
  ensureAudio(); sfx('click');
  if (key === 'music') AUDIO.next = 0;
}

const CFG = {
  baseSpeed: 150,     // 起始捲動速度 px/s
  maxSpeed: 400,      // 最高速度（物件從出現到碰到主角約 1.8 秒，還看得清楚）
  rampTime: 150,      // 幾秒後到達最高速
  spacing: 155,       // 物件之間的平均間距 px（速度越快，生成越頻繁）
  zombieChance: 0.3,  // 電子煙是喪屍煙彈的機率
  zombieTime: 6,      // 喪屍化持續秒數
  rollWeedChance: 0.3, // 撿到的捲菸有 30% 機率其實是大麻捲菸
  // 左右移動靈敏度：[起始, 最高速時]，會跟著捲動速度一起變靈敏
  follow: [6, 12],      // 滑鼠／手指跟隨的反應（越大越跟手）
  maxMove: [380, 720],  // 左右移動速度上限 px/s
  keySpeed: [300, 520], // 鍵盤左右移動速度 px/s
  nicBoost: [0.85, 1.2], // 尼古丁 20%→100% 時的移動倍率（菸癮滿足時比較靈活）
  nicDecay: 5,        // 起始速度時尼古丁每秒掉多少（會跟著速度等比例變快）
  goodStart: 60,      // 董氏基金會最早幾秒後出現
  goodCd: [35, 55],   // 董氏基金會出現間隔（秒）
  goodTime: 8,        // 懂事模式持續秒數
  quitSeconds: 15,    // 尼古丁歸零撐過幾秒 → 隱藏結局
  lungDelay: 1.5,     // 停止抽菸幾秒後，肺開始恢復
  lungRecover: 2.5,   // 肺每秒恢復多少（%）
  scarRate: 0.15,     // 每次傷害中，有多少比例變成永久疤痕（無法恢復）
  chainWindow: 1.5,   // 幾秒內再抽算「連抽」
  chainStep: 0.2,     // 每多連抽一根，傷害多 20%
  chainMax: 2,        // 連抽傷害最多 2 倍
  hospStart: 25,      // 醫院最早幾秒後出現
  hospCd: [22, 32],   // 醫院出現間隔（秒）
  hospHeal: 50,       // 醫院一次最多治療多少肺損傷
  hospBase: 800,      // 掛號＋基本費
  hospPerPt: 50,      // 每治療 1% 肺損傷的費用
  minPerCig: 20,      // 每根菸約少活 20 分鐘（UCL 2024 研究估計）
  chickenPrice: 85,   // 一塊雞排
};

// 難度：gain 尼古丁補充倍率、decay 尼古丁消耗倍率、enemy 稽查出現倍率
const DIFFS = [
  { id: 'easy',   name: '小菸槍', icon: '🙂', d1: '開局尼古丁 100%', d2: '掉得慢、稽查少', nic: 100, gain: 0.8,  decay: 0.8,  enemy: 0.75, money: 12000, color: '#2f9e44' },
  { id: 'normal', name: '老菸槍', icon: '😤', d1: '開局尼古丁 50%',  d2: '標準難度',       nic: 50,  gain: 0.65, decay: 1,    enemy: 1,    money: 10000, color: '#e67700' },
  { id: 'hard',   name: '菸蟲',   icon: '🐛', d1: '開局尼古丁 0%',   d2: '補少掉快稽查多', nic: 0,   gain: 0.5,  decay: 1.25, enemy: 1.3,  money: 8000,  color: '#c92a2a' },
];
let diffIdx = clamp(+(localStorage.getItem('smokerun_diff') ?? 1), 0, 2);
let D = DIFFS[diffIdx];

// 角色用生涯爽度逐步解鎖，並各自擁有不同的開局狀態與速度曲線。
const CHARS = [
  { id: 'young', name: '年輕人', icon: '🧑', desc: '肺乾淨 · 加速最快', unlock: 0, move: 1.12, pace: 1.08, accel: 1.25, lung: 1.10, lungStart: 0, scarStart: 0, nicStart: 0, nicDecay: 1, income: 1, fine: 1, color: '#228be6' },
  { id: 'elder', name: '老人',   icon: '👴', desc: '肺耗損 · 慢速耐跑', unlock: 5000, move: .88, pace: .82, accel: .58, lung: .88, lungStart: 22, scarStart: 8, nicStart: 0, nicDecay: .92, income: 1, fine: 1, color: '#7950f2' },
  { id: 'punk',  name: '流氓',   icon: '🕺', desc: '重度菸癮 · 發財快', unlock: 20000, move: 1, pace: 1, accel: .92, lung: 1, lungStart: 0, scarStart: 0, nicStart: -20, nicDecay: 1.35, income: 1.25, fine: .82, color: '#e8590c' },
];
let careerScore = Math.max(0, +(localStorage.getItem('smokerun_career_score') || 0));
if (!localStorage.getItem('smokerun_career_score')) {
  try { careerScore = Object.values(JSON.parse(localStorage.getItem('smokerun_bests') || '{}')).reduce((n, v) => n + Math.max(0, +v || 0), 0); } catch (e) {}
  localStorage.setItem('smokerun_career_score', Math.round(careerScore));
}
const charUnlocked = i => careerScore >= CHARS[i].unlock;
let charIdx = clamp(+(localStorage.getItem('smokerun_char') ?? 0), 0, CHARS.length - 1);
if (!charUnlocked(charIdx)) charIdx = 0;

// 菸品：nic 補充尼古丁、lung 肺損傷、harm 傷肺等級（畫面上的紅點）、cost 花費、count 算幾根
const ITEMS = {
  heat:  { nic: 14, lung: 1.5, harm: 1, cost: 8,   count: 1,  w: 30, h: 58, label: '加熱菸', msg: '「比較健康」？', color: '#a0c4ff' },
  vape:  { nic: 35, lung: 2.5, harm: 2, cost: 50,  count: 1,  w: 30, h: 60, label: '電子煙', msg: '違法電子煙！',   color: '#c77dff' },
  roll:  { nic: 18, lung: 5,   harm: 4, cost: 80,  count: 1,  w: 48, h: 42, label: '捲菸',   msg: '一支來路不明的捲菸…', color: '#d4a373' },
  cig:   { nic: 22, lung: 3,   harm: 2, cost: 6,   count: 1,  w: 42, h: 30, label: '紙菸',   msg: '+尼古丁',        color: '#ffd166' },
  cigar: { nic: 40, lung: 6,   harm: 3, cost: 300, count: 1,  w: 52, h: 30, label: '雪茄',   msg: '大人的味道～',   color: '#e9c46a' },
  pack:  { nic: 60, lung: 12,  harm: 5, cost: 125, count: 20, w: 34, h: 52, label: '整包菸', msg: '一口氣一包！',   color: '#ff9f1c' },
};

// 撿錢道具（樂透是隨機開獎）
const MONEY = {
  coin:    { amt: 200,  w: 30, h: 30 },
  cash:    { amt: 1000, w: 44, h: 30 },
  hongbao: { amt: 3000, w: 32, h: 42 },
  lotto:   { amt: 0,    w: 44, h: 34 },
};

// 身家等級：錢越多越誇張，越少越像乞丐
const TIERS = [
  { id: 'beggar', min: -Infinity, name: '落魄菸槍', icon: '🥣', down: '🪰 破產邊緣，蒼蠅找上門了……' },
  { id: 'ragged', min: 500,       name: '補丁菸槍', icon: '🩹', down: '👕 衣服破了……', up: '🧥 至少補好幾個洞了' },
  { id: 'shabby', min: 2000,      name: '寒酸菸槍', icon: '👕', down: '💸 越來越寒酸……', up: '🧼 終於洗了件衣服' },
  { id: 'normal', min: 5000,      name: '普通菸槍', icon: '🧥', down: '😐 回到普通人', up: '😐 回到普通人' },
  { id: 'suit',   min: 20000,     name: '西裝菸槍', icon: '👔', up: '👔 升級：西裝筆挺！' },
  { id: 'tycoon', min: 50000,     name: '土豪菸槍', icon: '💎', up: '💎 升級：金鍊墨鏡全上！' },
  { id: 'car',    min: 100000,    name: '跑車菸槍', icon: '🏎️', up: '🏎️ 升級：直接開跑車！' },
];
const tierOf = m => { let i = 0; TIERS.forEach((t, j) => { if (m >= t.min) i = j; }); return i; };
const tierProgress = (m, i = tierOf(m)) => {
  if (i >= TIERS.length - 1) return 1;
  const lo = Math.max(0, TIERS[i].min), hi = TIERS[i + 1].min;
  return clamp((m - lo) / (hi - lo), 0, 1);
};

const GATES = [
  [{ t: '🎰 樂透 ×3',       fx: () => { for (let i = 0; i < 3; i++) setTimeout(() => G && state === 'play' && collectMoney({ type: 'lotto', x: P.x, y: P.y - 40 * i }), i * 350); } },
   { t: '💼 加班 +$5,000',   fx: () => { const n = Math.round(5000 * incomeMult()); G.money += n; G.earned += n; pop(n > 5000 ? `💸 收入加成 +$${fmt(n)}` : '加班好累…好想抽菸', P.x, P.y - 100, '#ffd166'); G.nic = Math.max(0, G.nic - 30); } }],
  [{ t: '🚬 +1 包菸',       fx: () => smoke('pack', P.x, P.y) },
    { t: '💰 +NT$1,000',     fx: () => { const n = Math.round(1000 * incomeMult()); G.money += n; G.earned += n; if (n > 1000) pop(`💸 收入加成 +$${fmt(n)}`, P.x, P.y - 100, '#ffe066'); } }],
  [{ t: '🔥 尼古丁補滿',    fx: () => { G.nic = 100; addLung(6); } },
   { t: '🩺 肺部健檢',      fx: () => { G.healthy++; G.lung = Math.max(G.scar, G.lung - 8); pop('肺損傷 -8', P.x, P.y - 100, '#8ce99a'); } }],
  [{ t: '🚬 再來三根',      fx: () => { for (let i = 0; i < 3; i++) smoke('cig', P.x, P.y, true); } },
   { t: '🍬 尼古丁口香糖',  fx: () => { G.healthy++; G.nic = Math.min(100, G.nic + 25); pop('其實…這個能幫你戒菸喔', P.x, P.y - 100, '#8ce99a'); } }],
  [{ t: '🎁 朋友請菸 ×5',   fx: () => { for (let i = 0; i < 5; i++) smoke('cig', P.x, P.y, true); } },
   { t: '🏃 去慢跑',        fx: () => { G.healthy++; G.lung = Math.max(G.scar, G.lung - 5); G.nic = Math.max(0, G.nic - 20); pop('喘…喘死了', P.x, P.y - 100, '#ccc'); } }],
];

// ====== 成就 ======
const ACH = [
  { id: 'first',    icon: '🚬', name: '第一根',         desc: '抽下第一根菸',                     c: g => g.cigs >= 1 },
  { id: 'cig100',   icon: '🏭', name: '人體煙囪',       desc: '單局抽 100 根',                    c: g => g.cigs >= 100 },
  { id: 'pack3',    icon: '📦', name: '一天三包',       desc: '單局抽 3 整包菸',                  c: g => g.kinds.pack >= 3 },
  { id: 'cigar5',   icon: '🎩', name: '大老闆',         desc: '單局抽 5 支雪茄',                  c: g => g.kinds.cigar >= 5 },
  { id: 'heat10',   icon: '🤔', name: '我覺得比較健康', desc: '單局抽 10 支加熱菸',               c: g => g.kinds.heat >= 10 },
  { id: 'zombie',   icon: '🧟', name: '喪屍化',         desc: '抽到喪屍煙彈',                     c: g => g.zombies >= 1 },
  { id: 'zombie3',  icon: '🧠', name: '腦袋不見了',     desc: '單局喪屍化 3 次',                  c: g => g.zombies >= 3 },
  { id: 'fine10k',  icon: '🧾', name: '罰單收藏家',     desc: '單局罰款達 NT$10,000',             c: g => g.fines >= 10000 },
  { id: 'bucket5',  icon: '💦', name: '落湯雞',         desc: '單局被水桶潑 5 次',                c: g => g.buckets >= 5 },
  { id: 'room3',    icon: '🔒', name: '吸菸室常客',     desc: '單局被關進吸菸室 3 次',            c: g => g.rooms >= 3 },
  { id: 'escape',   icon: '🏃', name: '越獄成功',       desc: '從吸菸室逃出來',                   c: g => g.escapes >= 1 },
  { id: 't60',      icon: '⏱️', name: '還撐得住',       desc: '單局存活 60 秒',                   c: g => g.t >= 60 },
  { id: 't180',     icon: '🏅', name: '菸槍馬拉松',     desc: '單局存活 180 秒',                  c: g => g.t >= 180 },
  { id: 'speed',    icon: '⚡', name: '極速菸槍',       desc: '以任一角色達到最高速度等級',       c: g => g.speedLv >= 5 },
  { id: 'score3k',  icon: '😎', name: '爽度破表',       desc: '單局爽度達 3,000',                 c: g => g.score >= 3000 },
  { id: 'chicken',  icon: '🍗', name: '雞排都變成煙',   desc: '單局菸錢超過 NT$2,550（30 塊雞排）', c: g => g.cigMoney >= 2550 },
  { id: 'healthy3', icon: '🥗', name: '迷途知返？',     desc: '單局選 3 次健康選項',              c: g => g.healthy >= 3 },
  { id: 'hosp',     icon: '🏥', name: '掛號成功',       desc: '去醫院治療肺部',                   c: g => g.hosps >= 1 },
  { id: 'hosp3',    icon: '💉', name: '醫院 VIP',       desc: '單局去醫院 3 次',                  c: g => g.hosps >= 3 },
  { id: 'chain5',   icon: '🔗', name: '一根接一根',     desc: '連抽 5 根以上',                    c: g => g.maxChain >= 5 },
  { id: 'nosmoke',  icon: '🚭', name: '一根都沒抽',     desc: '開局 20 秒內都不抽菸',             c: g => g.t >= 20 && !(g.firstSmokeT < 20) },
  { id: 'poor',     icon: '🪙', name: '月光族',         desc: '錢剩 $100 以下還活著',             c: g => g.money > 0 && g.money <= 100 && !g.over },
  { id: 'relapse',  icon: '🏥', name: '出院就抽',       desc: '從醫院出來 3 秒內又抽菸',          c: g => g.relapse },

// 本機預覽連到 wrangler dev；GitHub Pages 連到正式 Worker。
const LB = {
  local: 'http://127.0.0.1:8787',
  production: 'https://smoke-run-api.smoke-run-level-api.workers.dev',
};
const localLB = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
const lbUrl = () => (localLB ? LB.local : LB.production).replace(/\/$/, '');
const lbOn = () => !!lbUrl();

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const player = { id: localStorage.getItem('smokerun_pid'), name: localStorage.getItem('smokerun_name') || '' };
if (!player.id) { player.id = uuid(); localStorage.setItem('smokerun_pid', player.id); }

async function api(path, body) {
  const r = await fetch(lbUrl() + path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error?.message || `HTTP ${r.status}`);
  return data;
}

function submitScore(g) {
  if (!lbOn() || !player.name || g.tut) return;
  g.lb = { st: 'up' };
  api('/api/scores', {
    playerId: player.id, name: player.name, diff: DIFFS[g.diff].id,
    character: g.char, score: Math.round(g.score), survive: Math.floor(g.t), cigs: g.cigs,
    ach: achCount(), achievementCount: achCount(), achievementPoints: achPoints(),
  }).then(r => { g.lb = { st: 'ok', rank: r.rank, best: r.best }; lbData = {}; })
    .catch(e => { console.warn(e); g.lb = { st: 'err' }; });
}

function submitPlayer() {
  if (!lbOn() || !player.name) return Promise.resolve();
  return api('/api/player', { playerId: player.id, name: player.name, ach: achCount(), achievementCount: achCount(), achievementPoints: achPoints() })
    .then(() => { lbData = {}; }).catch(e => console.warn(e));
}

const LB_TABS = [...DIFFS.map(d => ({ id: d.id, name: `${d.icon}${d.name}` })), { id: 'ach', name: '🏆成就' }];
const LB_CHARS = [{ id: 'all', name: '全部' }, ...CHARS.map(c => ({ id: c.id, name: `${c.icon}${c.name}` }))];
let lbBack = 'title', lbDiff = 1, lbChar = 'all', lbData = {};

function openLB(back) {
  lbBack = back;
  lbDiff = G && back === 'over' ? G.diff : diffIdx;
  state = 'lb';
  loadLB();
}

function loadLB() {
  const tab = LB_TABS[lbDiff];
  if (!lbOn()) return;
  const key = tab.id === 'ach' ? 'ach' : `${tab.id}:${lbChar}`;
  const cur = lbData[key];
  if (cur && (cur.st === 'load' || (cur.st === 'ok' && now() - cur.at < 20))) return;
  lbData[key] = { st: 'load' };
  const cq = tab.id === 'ach' || lbChar === 'all' ? '' : `&character=${encodeURIComponent(lbChar)}`;
  const q = `/api/leaderboard?board=${encodeURIComponent(tab.id)}&limit=15${cq}`;
  api(q).then(data => { lbData[key] = { st: 'ok', rows: data.rows, at: now() }; })
    .catch(e => { console.warn(e); lbData[key] = { st: 'err' }; });
}

// 暱稱輸入框（用 HTML 輸入框，手機才叫得出鍵盤）
const nameBox = document.getElementById('nameBox');
const nameInput = document.getElementById('nameInput');
const nameErr = document.getElementById('nameErr');
let nameAfter = null;
function nameOpen(after) {
  nameAfter = after;
  nameInput.value = player.name;
  nameErr.textContent = '';
  nameBox.hidden = false;
  input.left = input.right = false;
  setTimeout(() => nameInput.focus(), 50);
}
function nameClose() { nameBox.hidden = true; nameAfter = null; }
function nameSubmit() {
  const v = nameInput.value.trim().replace(/\s+/g, ' ');
  if (!v) { nameErr.textContent = '請輸入暱稱'; return; }
  if ([...v].length > 12) { nameErr.textContent = '最多 12 個字'; return; }
  player.name = v;
  localStorage.setItem('smokerun_name', v);
  const f = nameAfter;
  nameClose();
  if (f) f();
}
document.getElementById('nameOk').onclick = nameSubmit;
document.getElementById('nameCancel').onclick = nameClose;

const withdrawal = () => (G && G.nic < 20 ? (20 - G.nic) / 20 : 0);
// 喘氣程度：肺損傷 70% 開始，100% 時為 1
const breath = () => (G ? clamp((G.lung - 70) / 30, 0, 1) : 0);

// ====== 輸入 ======
const input = { left: false, right: false };
const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
const toY = e => { const r = cv.getBoundingClientRect(); return (e.clientY - r.top) / r.height * H; };
// 喪屍化時操作左右顛倒
const steer = x => (state === 'play' && G && G.zombie > 0 ? W - x : x);

// 按鈕：每一幀由繪圖函式登記，點擊時檢查
let btns = [];
function button(x, y, w, h, fn) { btns.push({ x, y, w, h, fn }); }
const hitBtn = (x, y) => btns.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);

let achBack = 'title', achPage = 0;
let overAchPage = 0;
const ACH_PER_PAGE = 9;
const achPages = () => Math.ceil(ACH.length / ACH_PER_PAGE);
const openAch = () => { achBack = state; achPage = 0; state = 'ach'; };
const canRestart = () => state === 'over' && G.overT > 0.8;
function pauseGame() {
  if (state !== 'play') return;
  input.left = input.right = false;
  state = 'pause';
  sfx('click');
}
function resumeGame() {
  if (state !== 'pause') return;
  state = 'play';
  AUDIO.next = 0;
  ensureAudio(); sfx('click');
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  if (P && state === 'play') P.tx = steer(toX(e));
  onTap(toX(e), toY(e));
});
cv.addEventListener('pointermove', e => {
  if (P && state === 'play' && (e.buttons || e.pointerType === 'mouse')) P.tx = steer(toX(e));
});
addEventListener('keydown', e => {
  const k = e.key;
  if (!nameBox.hidden) {
    if (k === 'Enter') nameSubmit();
    if (k === 'Escape') nameClose();
    return;
  }
  const L = k === 'ArrowLeft' || k === 'a' || k === 'A', R = k === 'ArrowRight' || k === 'd' || k === 'D';
  if (L) input.left = true;
  if (R) input.right = true;
  if (e.repeat) return;
  if (k === ' ' || k === 'Enter') e.preventDefault();
  if (state === 'play' && (k === 'Escape' || k === 'p' || k === 'P')) { pauseGame(); return; }
  if (state === 'pause' && (k === 'Escape' || k === 'p' || k === 'P' || k === ' ' || k === 'Enter')) { resumeGame(); return; }
  if (state === 'title') {
    if (L) diffIdx = (diffIdx + 2) % 3;
    if (R) diffIdx = (diffIdx + 1) % 3;
    if (k === ' ' || k === 'Enter') startGame();
    if (k === 'c' || k === 'C') openAch();
    if (k === 'l' || k === 'L') openLB('title');
    if (k === 't' || k === 'T') newTutorial();
  } else if (state === 'lb') {
    if (L) { lbDiff = (lbDiff + 3) % 4; loadLB(); }
    if (R) { lbDiff = (lbDiff + 1) % 4; loadLB(); }
    if (k === 'Escape' || k === 'Enter' || k === ' ') state = lbBack;
  } else if (state === 'ach') {
    if (L) achPage = Math.max(0, achPage - 1);
    if (R) achPage = Math.min(achPages() - 1, achPage + 1);
    if (k === ' ' || k === 'Enter' || k === 'Escape' || k === 'c' || k === 'C') state = achBack;
  } else if (canRestart()) {
    if (k === ' ' || k === 'Enter') newGame();
    if (k === 'c' || k === 'C') openAch();
    if (k === 'Escape') state = 'title';
  } else if (state === 'play' && (k === ' ' || k === 'Enter')) onTap();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
});

function onTap(x, y) {
  const b = x !== undefined && hitBtn(x, y);
  if (state !== 'play' || b) {
    if (b) b.fn();
    return;
  }
  if (G.trap) {
    G.trap.taps++;
    if (G.trap.taps >= G.trap.need) {
      G.trap.o.dead = true;
      G.trap = null;
      G.inv = 1;
      G.escapes++;
      P.tx = P.x;
      pop('終於逃出來了！', P.x, P.y - 80, '#8ce99a');
    }
  }
}

// ====== 遊戲邏輯 ======
function pop(text, x, y, color = '#fff', size = 18) {
  G.pops.push({ text, x: clamp(x, 80, W - 80), y, color, size, life: 1.2 });
}

function fine(amt, msg) {
  const paid = Math.round(amt * CHARS[charIdx].fine);
  G.money -= paid;
  G.fines += paid;
  G.inv = 1.2;
  G.shake = 0.4;
  const shown = paid === amt ? msg : msg.replace(/NT\$[\d,]+/, `NT$${fmt(paid)}`);
  pop(shown, P.x, P.y - 90, '#ff4d4d', 20);
  sfx('hit');
}

// 肺損傷：一部分可恢復，一部分變成永久疤痕
function addLung(v) {
  const harm = v * CHARS[charIdx].lung;
  G.lung = Math.min(100, G.lung + harm);
  G.scar = Math.min(G.lung, G.scar + harm * CFG.scarRate);
  G.lungPeak = Math.max(G.lungPeak, G.lung);
  const stage = Math.floor(G.lung / 10);
  if (stage > G.lungStage) {
    G.lungStage = stage;
    G.alveoliPop = 1;
    if (stage >= 3) pop(`🫧 啪！肺泡受損 ${stage * 10}%`, W / 2, 250, '#ff8787', 18);
    if (stage >= 5) sfx('hit');
  }
  G.sinceSmoke = 0;
}

function smoke(kind, x, y, silent = false) {
  const it = ITEMS[kind];
  const weedRoll = kind === 'roll' && Math.random() < CFG.rollWeedChance;
  G.nic = Math.min(100, G.nic + it.nic * D.gain);
  // 連抽：短時間內一直抽，傷害加重
  G.chain = G.sinceSmoke < CFG.chainWindow ? G.chain + 1 : 1;
  G.maxChain = Math.max(G.maxChain, G.chain);
  const mult = Math.min(CFG.chainMax, 1 + (G.chain - 1) * CFG.chainStep);
  addLung(it.lung * mult);
  if (G.chain >= 3 && !silent) pop(`🔗 連抽 ×${G.chain}！傷肺 ×${mult.toFixed(1)}`, P.x, P.y - 120, '#ff8787', 16);
  G.cigs += it.count;
  G.cigMoney += it.cost;
  G.money -= it.cost;
  G.score += it.nic * (G.weed > 0 || weedRoll ? 2 : 1);
  G.kinds[kind]++;
  if (G.firstSmokeT === undefined) G.firstSmokeT = G.t;
  if (G.t - G.lastHospT < 3) G.relapse = true;
  // 顯示扣錢，貴的菸會噴出鈔票
  G.pops.push({ text: `-$${it.cost}`, x: clamp(x + 34, 50, W - 50), y: y + 4, color: it.cost >= 100 ? '#ff6b6b' : '#ffc9c9', size: it.cost >= 100 ? 22 : 16, life: 1.1 });
  if (it.cost >= 100) {
    const n = it.cost >= 300 ? 10 : 6;
    for (let i = 0; i < n; i++) {
      G.parts.push({ x, y, vx: rand(-140, 140), vy: rand(-260, -80), life: 1, max: 1, r: 0, c: '', grow: 0, bill: true, rot: rand(0, 6), g: 380 });
    }
    G.shake = Math.max(G.shake, 0.15);
  }
  sfx('smoke');
  if (weedRoll) {
    G.weed = 10;
    G.weeds++;
    G.wanted = 12;
    pop('🌈 這支捲菸不對勁…分數、收入 ×2！', W / 2, 300, '#69db7c', 22);
    pop('🚔 迷幻時碰到警察，尿檢就直接坐牢', W / 2, 336, '#ff8787', 16);
    sfx('weed');
  } else if (kind === 'vape' && Math.random() < CFG.zombieChance) {
    zombify();
  } else {
    if (!silent) pop(it.msg, x, y - 20, it.color);
    if (kind === 'vape') { G.wanted = 8; pop('🚨 警察注意到你了！', W / 2, 300, '#ff6b6b', 22); }
  }
  if (G.inZone) {
    const zone = G.objs.find(o => o.type === 'zone' && Math.abs(o.x - P.x) < o.w / 2 && Math.abs(o.y - P.y) < o.h / 2);
    if (zone) zone.smoked = true;
    G.cleanStreak = 0;
    fine(2000, '禁菸區吸菸！罰 NT$2,000');
  }
}

function zombify() {
  G.zombie = CFG.zombieTime;
  G.zombies++;
  addLung(8);
  G.wanted = 10;
  G.shake = 0.5;
  sfx('hit');
  pop('🧟 喪屍煙彈！！', W / 2, 300, '#69db7c', 28);
  pop('身體不受控制、操作顛倒！', W / 2, 336, '#b2f2bb', 18);
}

function becomeGood(o) {
  G.good = CFG.goodTime;
  G.tungs++;
  G.zombie = 0;
  G.wanted = 0;
  sfx('heal');
  pop('😇 董氏基金會來了！', W / 2, 300, '#ffe066', 26);
  pop('我…我懂事了', P.x, P.y - 90, '#fff', 20);
  // 場上的菸全部消失
  for (const it of G.objs) {

    }
  }
}

function collectMoney(o) {
  let amt = MONEY[o.type].amt, msg = `+$${fmt(amt)}`, col = '#8ce99a', size = 18;
  if (o.type === 'lotto') {
    // 樂透：大多槓龜，偶爾中大獎
    const r = Math.random();
    amt = r < 0.5 ? 0 : r < 0.8 ? 2000 : r < 0.95 ? 10000 : 50000;
    G.money -= 200;
    msg = amt ? `🎰 中獎 +$${fmt(amt)}！` : '🎰 槓龜… -$200';
    col = amt >= 10000 ? '#ffd43b' : amt ? '#8ce99a' : '#adb5bd';
    size = amt >= 10000 ? 26 : 18;
    if (amt >= 50000) { G.jackpot = true; G.shake = 0.5; pop('💰💰 頭獎！！ 💰💰', W / 2, 300, '#ffd43b', 30); }
  } else if (o.type === 'hongbao') msg = `🧧 紅包 +$${fmt(amt)}`;
  const mult = incomeMult();
  if (amt > 0 && mult > 1) {
    amt = Math.round(amt * mult);
    msg = `${G.weed > 0 ? '🌈' : '💸'} ×${mult.toFixed(mult % 1 ? 2 : 0)} +$${fmt(amt)}！`;
    col = '#ffe066';
    size = Math.max(size, 21);
  }
  G.money += amt;
  G.earned = (G.earned || 0) + amt;
  pop(msg, o.x, o.y - 20, col, size);
  sfx(amt > 0 ? 'money' : 'hit');
  if (amt >= 1000) {
    for (let i = 0; i < Math.min(20, amt / 500); i++) {
      G.parts.push({ x: o.x, y: o.y, vx: rand(-120, 120), vy: rand(-220, -60), life: 0.9, max: 0.9, r: rand(3, 5), c: '255,212,59', grow: 0, g: 380 });
    }
  }
}

function enterHospital(o) {
  o.used = true;
  const can = Math.min(CFG.hospHeal, G.lung - G.scar);
  if (can < 3) { pop('醫生：你的肺還好，回去吧', P.x, P.y - 100, '#a5d8ff'); return; }
  // 錢不夠就能治多少算多少（但掛號費照收）
  const afford = Math.max(0, (G.money - CFG.hospBase) / CFG.hospPerPt);
  const heal = Math.min(can, afford);
  const cost = Math.round(CFG.hospBase + heal * CFG.hospPerPt);
  G.lung -= heal;
  G.money -= cost;
  G.hospCost += cost;
  G.healed += heal;
  G.hosps++;
  G.lastHospT = G.t;
  G.inv = 1;
  sfx('heal');
  pop(`🏥 肺損傷 -${Math.round(heal)}%`, P.x, P.y - 110, '#8ce99a', 22);
  pop(`醫藥費 NT$${fmt(cost)}`, P.x, P.y - 80, '#ffa8a8', 18);
  if (heal < can) pop('錢不夠…只能治一部分', W / 2, 300, '#ffa8a8', 18);
  for (let i = 0; i < 14; i++) {
    G.parts.push({ x: P.x + rand(-20, 20), y: P.y - 20, vx: rand(-60, 60), vy: rand(-160, -60), life: 0.9, max: 0.9, r: rand(3, 5), c: '140,233,154', grow: 2 });
  }
}

function hitEnemy(o) {
  if (o.type === 'police' && G.weed > 0) {
    G.urineTests++;
    G.shake = 0.7;
    pop('🚔 尿檢呈陽性！直接坐牢', W / 2, 280, '#ff4d4d', 25);

    end('jail');

  }
  // 懂事模式：沒在抽菸，稽查拿你沒轍

  else if (o.type === 'bucket') {

    G.buckets++;

      G.parts.push({ x: P.x, y: P.y - 20, vx: rand(-160, 160), vy: rand(-200, 40), life: 0.6, max: 0.6, r: rand(2, 5), c: '116,192,252', grow: 0 });
    }
  }
}

function collectCat(o) {
  G.cats++;
  G.catTotal = G.cats;
  G.score += 25 * rewardMult();
  G.nic = Math.max(0, G.nic - 4);
  pop(G.cats < 10 ? `🐈 本局變身進度 ${G.cats}/10` : `🐾 本局街貓 ${G.cats} 隻`, o.x, o.y - 24, '#ffe066', 19);

function rewardZone(o) {
  if (o.rewarded || !o.entered) return;
  o.rewarded = true;
  if (o.smoked) {
    G.cleanStreak = 0;
    pop('禁菸區挑戰失敗', P.x, P.y - 100, '#adb5bd', 16);
    return;
  }
  G.cleanZones++;
  G.cleanStreak++;
  G.maxCleanStreak = Math.max(G.maxCleanStreak, G.cleanStreak);
  const base = Math.min(1200, 500 + (G.cleanStreak - 1) * 100);
  const reward = Math.round(base * incomeMult());
  G.money += reward;
  G.earned += reward;
  G.zoneMoney += reward;
  G.healthy++;
  pop(`🚭 忍住了！+$${fmt(reward)}${reward > base ? ' 收入加成' : ''}（連續 ${G.cleanStreak}）`, P.x, P.y - 110, '#8ce99a', 19);
  sfx('zone');
}

function trapIn(o) {
  G.rooms++;
  o.used = true;
  G.trap = { o, taps: 0, need: 6 + G.rooms * 4 };
  sfx('smoke');
  pop('歡迎光臨吸菸室～☁️', P.x, P.y - 110, '#ffd23f', 20);
}

function spawnSmall(type, x) {
  let o;
  if (ITEMS[type]) o = { kind: 'item', w: ITEMS[type].w, h: ITEMS[type].h };
  else if (MONEY[type]) o = { kind: 'item', w: MONEY[type].w, h: MONEY[type].h };
  else if (type === 'cat') o = { kind: 'cat', w: 48, h: 42, sp: .88 };
  else if (type === 'bystander') o = { kind: 'bystander', w: 38, h: 58, sp: .82, flee: false };
  else if (type === 'inspector') o = { kind: 'enemy', w: 44, h: 60, vx: (Math.random() < .5 ? -1 : 1) * rand(30, 70) };
  else if (type === 'police') o = { kind: 'enemy', w: 44, h: 60, chase: G.wanted > 0 ? 150 : 35, sp: 1.1 };
  else if (type === 'bucket') o = { kind: 'enemy', w: 42, h: 50 };
  else if (type === 'tung') o = { kind: 'special', w: 70, h: 72 };
  o.type = type;
  o.x = x ?? rand(60, W - 60);
  o.y = -50;
  o.seed = Math.random() * 100;
  G.objs.push(o);
}

function spawn() {
  // 大型物件（有冷卻）
  if (G.cd.gate <= 0 && Math.random() < 0.12) {
    const pair = GATES[Math.floor(Math.random() * GATES.length)].slice();
    if (Math.random() < .5) pair.reverse();
    G.objs.push({ type: 'gate', x: W / 2, y: -130, w: W, h: 70, opts: pair });
    G.cd.gate = 14; G.cd.room = Math.max(G.cd.room, 3);
    G.spawnT = 0.5;
    return;
  }
  if (G.cd.zone <= 0 && Math.random() < 0.12) {
    const w = rand(W * 0.5, W * 0.68), left = Math.random() < .5;
    G.objs.push({ type: 'zone', x: left ? w / 2 : W - w / 2, y: -150, w, h: 280, entered: false, smoked: false, rewarded: false });
    G.cd.zone = 8;
    // 禁菸區裡放幾根菸當誘餌
    spawnSmall('cig', left ? rand(40, w - 30) : rand(W - w + 30, W - 40));
    return;
  }
  if (G.cd.tung <= 0 && G.good <= 0 && Math.random() < 0.15) {
    spawnSmall('tung', rand(80, W - 80));
    G.cd.tung = rand(CFG.goodCd[0], CFG.goodCd[1]);
    return;
  }
  if (G.cd.hosp <= 0 && Math.random() < 0.15) {
    G.objs.push({ type: 'hosp', x: rand(95, W - 95), y: -90, w: 130, h: 110 });
    G.cd.hosp = rand(CFG.hospCd[0], CFG.hospCd[1]);
    G.cd.room = Math.max(G.cd.room, 3);
    return;
  }
  if (G.cd.room <= 0 && Math.random() < 0.10) {
    G.objs.push({ type: 'room', x: rand(100, W - 100), y: -100, w: 150, h: 150, seed: Math.random() * 100 });
    G.cd.room = 12; G.cd.gate = Math.max(G.cd.gate, 3);
    return;
  }

  // 小型物件（權重隨時間變化）
  const k = Math.min(1, G.t / 90), e = D.enemy;
  const table = [
    ['cig', 28], ['heat', 7], ['cigar', 5], ['pack', 4], ['vape', 4], ['roll', G.t > 20 ? 3 : 0],
    ['cat', 2.8], ['bystander', 5.5],
    ['coin', 7], ['cash', 3.5], ['hongbao', 1.5], ['lotto', 2],
    ['inspector', (12 + 8 * k) * e], ['bucket', (10 + 4 * k) * e], ['police', ((G.wanted > 0 ? 25 : 5) + 6 * k) * e],
  ];
  let sum = table.reduce((s, r) => s + r[1], 0), r = Math.random() * sum;
  for (const [type, wgt] of table) {
    if ((r -= wgt) < 0) {
      if (ITEMS[type] && G.good > 0) return;  // 懂事模式不會出現菸
      spawnSmall(type); if (ITEMS[type]) G.lastCig = 0; return;
    }
  }
}

function update(dt) {
  G.t += dt;
  const C = CHARS[charIdx];
  // 角色 pace 控制起步與最高速度，accel 控制多久進入後期速度。
  const sp = G.tut ? 0 : Math.min(1, G.t / (CFG.rampTime / C.accel));
  const baseSpeed = CFG.baseSpeed * C.pace, maxSpeed = CFG.maxSpeed * C.pace;
  G.speedMix = 1 - (1 - sp) * (1 - sp);
  G.speed = baseSpeed + (maxSpeed - baseSpeed) * G.speedMix;
  if (G.tut) { G.speed = 130; G.speedMix = 0; }
  const lv = Math.min(5, Math.floor(sp * 5 + 1e-9));
  if (lv > G.speedLv) {
    G.speedLv = lv;
    pop(lv === 5 ? '⚡ 最高速度！' : `⏩ 加速！ Lv.${lv + 1}`, W / 2, 280, '#ffe066', 22);
    sfx('click');
  }
  G.dist += G.speed * dt / 40;
  bgOff = (bgOff + G.speed * dt) % 80;
  G.inv = Math.max(0, G.inv - dt);
  G.shake = Math.max(0, G.shake - dt);
  G.tierT = Math.max(0, G.tierT - dt);
  G.wanted = Math.max(0, G.wanted - dt);
  G.bystanderT = Math.max(0, G.bystanderT - dt);
  G.alveoliPop = Math.max(0, G.alveoliPop - dt);
  G.weed = Math.max(0, G.weed - dt);
  if (G.zombie > 0) {
    G.zombie -= dt;
    if (G.zombie <= 0) { G.zombie = 0; P.tx = P.x; pop('…呼，清醒了', P.x, P.y - 90, '#b2f2bb'); }
  }
  if (G.good > 0) {
    G.good -= dt;
    if (G.good <= 0) { G.good = 0; pop('……果然還是想抽一根', P.x, P.y - 90, '#ffd166'); }
  }

  // 尼古丁：消耗速度跟捲動速度成正比（懂事模式時暫停）
  if (G.good <= 0) G.nic -= CFG.nicDecay * D.decay * C.nicDecay * (G.speed / baseSpeed) * (G.catMode ? .8 : 1) * dt;
  if (G.trap) { G.nic += 35 * dt; addLung(2.2 * dt); }
  // 肺部自然恢復：停止抽菸一陣子後慢慢下降，但永久疤痕不會好
  G.sinceSmoke += dt;
  if (G.sinceSmoke > CFG.lungDelay && G.lung > G.scar) {
    G.lung = Math.max(G.scar, G.lung - CFG.lungRecover * (G.good > 0 ? 2 : 1) * (G.catMode ? 1.3 : 1) * dt);
  }
  G.nic = clamp(G.nic, 0, 100);
  if (G.good <= 0) G.score += (G.nic / 100) * 10 * dt * (G.trap ? 2 : 1) * rewardMult();

  if (G.tut) tutUpdate(dt);

  // 隱藏結局：尼古丁歸零撐過一段時間
  if (G.nic <= 0 && G.good <= 0 && !G.tut && G.cigs > 0) {
    G.quitT += dt;
    if (G.quitT >= CFG.quitSeconds) return end('quit');
  } else G.quitT = 0;

  // 移動（戒斷時會手抖、反應變慢）
  const wd = withdrawal();
  if (!G.trap) {
    // 靈敏度跟著捲動速度：一開始比較穩，越跑越快、越跟手
    const r = G.speedMix;
    const lerp = ([a, b]) => a + (b - a) * r;
    // 尼古丁越高越靈活（20% 以下由戒斷效果接手）
    const nb = CFG.nicBoost, boost = (nb[0] + (nb[1] - nb[0]) * clamp((G.nic - 20) / 80, 0, 1)) * CHARS[charIdx].move;
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    P.tx += dir * (G.zombie > 0 ? -1 : 1) * lerp(CFG.keySpeed) * boost * dt;
    // 喪屍化：身體會不受控制地亂晃
    if (G.zombie > 0) P.tx += Math.sin(G.t * 3.1) * 160 * dt + Math.sin(G.t * 7.3) * 90 * dt;
    P.tx = clamp(P.tx, 30, W - 30);
    // 喘不過氣：肺損傷 70% 以上，動作變遲緩
    const gasp = 1 - 0.3 * breath();
    const k = lerp(CFG.follow) * boost * gasp * (1 - 0.75 * wd);
    const lim = lerp(CFG.maxMove) * boost * gasp * dt;
    P.x += clamp((P.tx - P.x) * Math.min(1, k * dt), -lim, lim);
    if (wd > 0) P.x += (Math.random() - .5) * wd * 6;
    P.x = clamp(P.x, 24, W - 24);
    P.walk += dt * G.speed / 22;
  }

  // 咳嗽 → 喘氣：越接近爆肺越頻繁
  if (G.lung > 50 && (G.coughT -= dt) <= 0) {
    const b = breath();
    const s = b > 0.6 ? ['呼…哈…呼…哈…', '喘…喘不過氣…', '哈…哈…'] : b > 0 ? ['呼…哈…', '咳咳…呼…'] : ['咳咳…'];
    pop(s[Math.floor(Math.random() * s.length)], P.x - 30, P.y - 60, b > 0.6 ? '#ffa8a8' : '#ccc', 15 + b * 4);
    G.coughT = b > 0 ? rand(0.9, 1.6) - b * 0.4 : rand(2, 4);
  }
  if (breath() > 0 && Math.random() < breath() * 4 * dt) {
    G.parts.push({ x: P.x + rand(-12, 12), y: P.y - 34, vx: rand(-30, 30), vy: rand(10, 60), life: 0.6, max: 0.6, r: 2.5, c: '120,190,255', grow: 0, g: 200 });
  }

  // 生成（教學模式由腳本控制）
  G.spawnT -= dt;
  for (const key in G.cd) G.cd[key] -= dt;
  if (G.tut) {
    // 教學不生成隨機物件
  } else if (G.spawnT <= 0) {
    spawn();
    // 依速度換算間隔，讓畫面上的物件密度大致固定，不會越快越擠
    G.spawnT = Math.max(G.spawnT, CFG.spacing / G.speed * rand(0.8, 1.2));
  }
  G.lastCig += dt;
  if (G.lastCig > 330 / G.speed && G.good <= 0 && !G.tut) { spawnSmall('cig'); G.lastCig = 0; }

  // 物件移動
  for (const o of G.objs) {
    if (o.dead) continue;
    if (G.trap && o === G.trap.o) { o.x = P.x; o.y = P.y - 14; continue; }
    o.y += G.speed * dt * (o.sp || 1);
    if (o.kind === 'bystander' && !o.flee && G.good <= 0 && G.nic > 0
      && Math.abs(o.y - P.y) < 230 && Math.abs(o.x - P.x) < 175) {
      o.flee = true;
      G.bystandersFled++;
      const side = o.x === P.x ? (Math.random() < .5 ? -1 : 1) : Math.sign(o.x - P.x);
      o.vx = side * rand(190, 260);
      if (G.bystanderT <= 0) {
        const warnings = ['😷 二手菸，離遠一點！', '咳咳…有人在抽菸！', '🚭 路人：先閃了！'];
        pop(warnings[Math.floor(o.seed) % warnings.length], o.x, o.y - 48, '#e7f5ff', 16);
        G.bystanderT = 1.2;
      }
    }
    if (o.vx) {
      o.x += o.vx * dt;
      if (!(o.kind === 'bystander' && o.flee)) {
        if (o.x < 50) { o.x = 50; o.vx *= -1; }
        if (o.x > W - 50) { o.x = W - 50; o.vx *= -1; }
      }
    }
    if (o.chase) o.x += Math.sign(P.x - o.x) * Math.min(Math.abs(P.x - o.x), o.chase * dt);
    if (o.type === 'zone' && o.entered && !o.rewarded && o.y - o.h / 2 > P.y + P.h / 2) rewardZone(o);
  }

  const activeZone = G.objs.find(o => o.type === 'zone' && Math.abs(o.x - P.x) < o.w / 2 && Math.abs(o.y - P.y) < o.h / 2);
  G.inZone = !!activeZone;
  if (activeZone && !activeZone.entered) {
    activeZone.entered = true;
    G.zonesEntered++;
    pop('🚭 撐到出口不抽菸，可得 $500+', P.x, P.y - 110, '#ffe066', 17);
  }

  // 碰撞
  // 開跑車時車身比較大，比較好撿東西，但也比較容易被撞
  const inCar = G.tier === 6 && G.good <= 0;
  const pw = inCar ? 60 : P.w, ph = inCar ? 100 : P.h;
  const hitP = (o, s = 0.75) => Math.abs(o.x - P.x) < (o.w + pw) / 2 * s && Math.abs(o.y - P.y) < (o.h + ph) / 2 * s;
  for (const o of G.objs) {
    if (o.dead) continue;
    if (o.type === 'gate') {
      if (!o.done && o.y >= P.y) {
        o.done = true;
        if (G.trap) pop('被關著…錯過了', P.x, P.y - 130, '#aaa');
        else { const op = o.opts[P.x < W / 2 ? 0 : 1]; op.fx(); pop(op.t, P.x, P.y - 130, '#fff', 22); sfx('click'); }
      }
      continue;
    }
    if (o.type === 'zone') continue;
    if (o.type === 'hosp') { if (!G.trap && !o.used && hitP(o, 0.6)) enterHospital(o); continue; }
    if (o.type === 'room') {
      if (!G.trap && !o.used && hitP(o, 0.55)) {
        if (G.good > 0) { o.used = true; pop('乖寶寶不進吸菸室 🙅', P.x, P.y - 100, '#8ce99a'); }
        else trapIn(o);
      }
      continue;
    }
    if (G.trap) continue;
    if (o.kind === 'special' && hitP(o, 0.7)) { o.dead = true; becomeGood(o); continue; }
    if (o.kind === 'cat' && hitP(o, 0.75)) { o.dead = true; collectCat(o); continue; }
    if (o.kind === 'item' && hitP(o)) {
      o.dead = true;
      if (MONEY[o.type]) collectMoney(o);
      else smoke(o.type, o.x, o.y);
    } else if (o.kind === 'enemy' && G.inv <= 0 && hitP(o, 0.65)) {
      o.dead = true;
      hitEnemy(o);
      if (state === 'over') return;
    }
  }
  G.objs = G.objs.filter(o => !o.dead && o.y - o.h / 2 < H + 40);

  // 菸霧粒子
  G.smokeT -= dt;
  if (G.nic > 0 && G.good <= 0 && G.smokeT <= 0) {
    G.parts.push({ x: P.x + 20, y: P.y - 18, vx: rand(-15, 15), vy: G.speed * 0.45, life: 1, max: 1, r: 3, c: '220,220,220', grow: 10 });
    G.smokeT = 0.05 + (1 - G.nic / 100) * 0.18;
  }
  if (G.trap && Math.random() < 0.5) {
    const o = G.trap.o;
    G.parts.push({ x: o.x + rand(-60, 60), y: o.y + rand(-50, 60), vx: rand(-10, 10), vy: -20, life: 1.5, max: 1.5, r: 6, c: '210,210,210', grow: 14 });
  }
  for (const p of G.parts) {
    if (p.g) p.vy += p.g * dt;
    if (p.bill) p.rot += dt * 6;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.r += p.grow * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 50 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);

  // 身家等級變化
  const ti = tierOf(G.money);
  if (G.tier === null) G.tier = ti;
  if (ti !== G.tier) {
    const up = ti > G.tier, T = TIERS[ti];
    const msg = up ? T.up : T.down;
    if (msg) pop(msg, W / 2, 360, up ? '#ffd43b' : '#adb5bd', 20);
    if (up && ti >= 4) { G.shake = 0.3; for (let i = 0; i < 18; i++) G.parts.push({ x: P.x, y: P.y - 10, vx: rand(-160, 160), vy: rand(-260, -60), life: 1, max: 1, r: rand(2, 4), c: '255,212,59', grow: 0, g: 300 }); }
    G.tier = ti;
    G.tierT = 3.5;
  }
  G.maxMoney = Math.max(G.maxMoney, G.money);
  if (ti === 0) G.wasBeggar = true;
  if (G.wasBeggar && ti >= 4) G.comeback = true;

  // 成就提示一次顯示一個，依序播放
  if (toasts.length && (toasts[0].life -= dt) <= 0) toasts.shift();
  checkAch();

  if (G.tut) {
    // 教學不會死
    G.lung = Math.min(G.lung, 95); G.scar = Math.min(G.scar, G.lung); G.money = Math.max(G.money, 2000);
    return;
  }
  if (G.lung >= 100) { G.lung = 100; G.scar = Math.min(G.scar, 100); return end('lung'); }
  if (G.money <= 0) return end('broke');
}

// ====== 新手教學 ======
// 每一步：進入時的設定(enter)、完成條件(done)、提示文字
const TUT = [
  { title: '左右移動', text: ['拖曳滑鼠／手指，或按 ← → 鍵', '碰到左右兩邊的綠框'],
    enter: t => { t.L = t.R = false; },
    tick: t => { if (P.x < 110) t.L = true; if (P.x > W - 110) t.R = true; },
    done: t => t.L && t.R },
  { title: '撿菸補尼古丁', text: ['尼古丁會一直往下掉', '太低會戒斷手抖，撿 3 根菸補回來'],
    enter: t => { G.nic = 35; t.base = G.cigs; t.spawnEvery = 1.1; t.what = 'cig'; },
    done: t => G.cigs - t.base >= 3 },
  { title: '看清楚傷肺等級', text: ['菸下方的 ● 越多越傷肺，也越貴', '雪茄要 $300！撿一支看看'],
    enter: t => { t.base = G.kinds.cigar; t.spawnEvery = 1.6; t.what = 'cigar'; },
    done: t => G.kinds.cigar > t.base },
  { title: '閃避稽查', text: ['衛生局、警察會罰錢，水桶會澆熄菸', '連續閃過 4 個不被抓到'],
    enter: t => { t.dodged = 0; t.hitBase = G.fines + G.buckets; t.spawnEvery = 1.3; t.what = 'enemy'; },
    tick: t => { if (G.fines + G.buckets > t.hitBase) { t.dodged = 0; t.hitBase = G.fines + G.buckets; pop('被抓到了，重來！', W / 2, 300, '#ff8787', 20); } },
    done: t => t.dodged >= 4 },
  { title: '讓肺休息', text: ['不抽菸時，肺損傷會慢慢恢復', '但深紅色的永久疤痕好不了'],
    enter: t => { G.lung = 75; G.scar = 12; G.sinceSmoke = 0; G.nic = 100; t.what = null; },
    done: t => G.lung <= 60 },
  { title: '去醫院治療', text: ['醫院可以把肺治好一大截', '但要付醫藥費，走進去試試'],
    enter: t => { G.lung = 80; G.scar = 12; t.base = G.hosps; t.what = 'hosp'; t.spawnEvery = 4; t.sinceSpawn = 99; },
    done: t => G.hosps > t.base },
  { title: '教學完成！', text: ['還有吸菸區、禁菸區、董氏基金會', '就留給你自己去發現吧 😏'],
    enter: t => { t.what = null; t.endT = 3.5; },
    done: t => (t.endT -= 1 / 60) <= 0 },
];

function newTutorial() {
  diffIdx = 0;
  newGame();
  plays--; localStorage.setItem('smokerun_plays', plays);
  G.tut = { step: -1, stepT: 0, sinceSpawn: 0, flash: 0 };
  tutNext();
}

function tutNext() {
  const t = G.tut;
  t.step++;
  t.stepT = 0;
  t.flash = t.step > 0 ? 1 : 0;
  if (t.step >= TUT.length) { state = 'title'; return; }
  if (t.step === TUT.length - 1) {
    t.done = true;
    localStorage.setItem('smokerun_tut', '1');
    checkAch();
  }
  if (t.step > 0) pop('✔ 完成！', W / 2, 330, '#8ce99a', 26);
  // 清掉上一步留下的菸和敵人
  G.objs = G.objs.filter(o => !o.kind);
  TUT[t.step].enter(t);
}

function tutUpdate(dt) {
  const t = G.tut, s = TUT[t.step];
  t.stepT += dt;
  t.flash = Math.max(0, t.flash - dt);
  G.nic = Math.max(G.nic, t.step === 1 ? 5 : 30);
  if (s.tick) s.tick(t);
  // 依步驟生成物件
  t.sinceSpawn = (t.sinceSpawn || 0) + dt;
  if (t.what && t.sinceSpawn >= t.spawnEvery) {
    t.sinceSpawn = 0;
    if (t.what === 'enemy') {
      const type = ['inspector', 'bucket', 'police'][Math.floor(Math.random() * 3)];
      spawnSmall(type, clamp(P.x + rand(-40, 40), 60, W - 60));
      G.objs.at(-1).tutDodge = true;
    } else if (t.what === 'hosp') {
      if (!G.objs.some(o => o.type === 'hosp' && !o.used)) G.objs.push({ type: 'hosp', x: rand(110, W - 110), y: -90, w: 130, h: 110 });
    } else spawnSmall(t.what);
  }
  // 敵人通過主角下方 = 閃過
  for (const o of G.objs) {
    if (o.tutDodge && !o.dead && o.y > P.y + 40) { o.tutDodge = false; t.dodged++; }
  }
  if (t.stepT > 0.6 && s.done(t)) tutNext();
}

function drawTutorial() {
  const t = G.tut, s = TUT[t.step];
  if (!s) return;
  // 移動教學：左右兩側目標框
  if (t.step === 0) {
    for (const [side, ok] of [[0, t.L], [1, t.R]]) {
      const x = side ? W - 100 : 0;
      ctx.fillStyle = ok ? 'rgba(140,233,154,.35)' : `rgba(140,233,154,${0.12 + Math.sin(now() * 5) * 0.08})`;
      ctx.fillRect(x, 100, 100, H - 100);
      ctx.strokeStyle = '#8ce99a'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.strokeRect(x + 2, 102, 96, H - 104); ctx.setLineDash([]);
      txtS(ok ? '✔' : side ? '→' : '←', x + 50, H / 2, 40, ok ? '#8ce99a' : '#fff');
    }
  }
  // 提示框
  const x = 20, y = 104, w = W - 40, h = 104;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(x + 3, y + 5, w, h, 14); ctx.fill();
  ctx.fillStyle = '#e7f5ff'; rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#1c7ed6'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#1c7ed6'; rr(x + 12, y - 12, 116, 26, 13); ctx.fill();
  txt(`📖 教學 ${Math.min(t.step + 1, TUT.length)}/${TUT.length}`, x + 70, y + 1, 13, '#fff');
  txt(s.title, x + 18, y + 32, 20, '#1864ab', 'left');
  s.text.forEach((l, i) => txt(l, x + 18, y + 60 + i * 22, 15, '#333', 'left', 'normal'));
  // 進度
  let prog = '';
  if (t.step === 1) prog = `${Math.min(3, G.cigs - t.base)}/3`;
  if (t.step === 3) prog = `${t.dodged}/4`;
  if (t.step === 4) prog = `${Math.round(G.lung)}% → 60%`;
  if (prog) txt(prog, x + w - 16, y + 32, 16, '#1c7ed6', 'right');
  if (t.flash > 0) {
    ctx.fillStyle = `rgba(140,233,154,${t.flash * 0.3})`; ctx.fillRect(0, 0, W, H);
  }
  btn(W - 96, H - 56, 80, 38, '跳過', '#868e96', () => { localStorage.setItem('smokerun_tut', '1'); state = 'title'; }, 15);
}

function endingFor(cause) {
  if (cause === 'jail') return {
    icon: '🚔', title: '尿檢陽性，直接坐牢',
    detail: '來路不明的捲菸，讓這一局直接失去自由。',
    trigger: '迷幻狀態下碰到警察臨檢', color: '#e03131', bg: '#26090d',
  };
  if (cause === 'quit') return {
    icon: '🌤️', title: '撐過戒斷，成功停下來',
    detail: '這次沒有用下一根菸處理菸癮。',
    trigger: `尼古丁歸零後撐過 ${CFG.quitSeconds} 秒`, color: '#2f9e44', bg: '#092317',
  };
  if (cause === 'lung') {
    if (G.cigs >= 100 || G.t >= 240) return {
      icon: '🎗️', title: '肺癌第四期',
      detail: '大量吸菸與持續肺損傷，換來最沉重的診斷。',
      trigger: `抽了 ${fmt(G.cigs)} 根，肺損傷累積到 100%`, color: '#d9480f', bg: '#2b1008',
    };
    if (G.maxChain >= 5 || G.kinds.pack >= 2) return {
      icon: '🫁', title: '肺泡大面積破裂',
      detail: '一根接一根，肺泡再也承受不住。',
      trigger: `最高連抽 ×${G.maxChain}，肺損傷達 100%`, color: '#e03131', bg: '#28090d',
    };
    return {
      icon: '🫁', title: '肺部病變，呼吸衰竭',
      detail: '每次傷害都留下痕跡，最後連呼吸都成了負擔。',
      trigger: `永久疤痕 ${Math.round(G.scar)}%，肺損傷達 100%`, color: '#c92a2a', bg: '#25090c',
    };
  }
  if (cause === 'broke') {
    if (G.cigMoney >= G.fines && G.cigMoney >= G.hospCost) return {
      icon: '🛒', title: '菸錢燒光，流落街頭',
      detail: '一根看似不貴，累積起來卻能掏空生活。',
      trigger: `菸品花費 $${fmt(G.cigMoney)}，身上金錢歸零`, color: '#e8590c', bg: '#281408',
    };
    if (G.hospCost >= G.fines) return {
      icon: '🏥', title: '醫藥費拖垮生活',
      detail: '傷害不只留在肺裡，也出現在每一張帳單上。',
      trigger: `醫藥費 $${fmt(G.hospCost)}，身上金錢歸零`, color: '#d6336c', bg: '#260a18',
    };
    return {
      icon: '🧾', title: '罰單繳到破產',
      detail: '違規吸菸的代價，一張一張壓垮生活。',
      trigger: `累積罰款 $${fmt(G.fines)}，身上金錢歸零`, color: '#e67700', bg: '#281704',
    };
  }
  return { icon: '⚠️', title: '遊戲結束', detail: '這次跑不下去了。', trigger: '未分類原因', color: '#e03131', bg: '#25090c' };
}

function end(cause) {
  G.over = cause;
  G.overT = 0;
  overAchPage = 0;
  G.ending = endingFor(cause);
  G.satire = SATIRE[Math.floor(Math.random() * SATIRE.length)];
  G.healthFact = HEALTH_FACTS[Math.floor(Math.random() * HEALTH_FACTS.length)];
  state = 'over';
  if (!G.tut) {
    const before = careerScore;
    G.careerGain = Math.round(G.score);
    careerScore += G.careerGain;
    localStorage.setItem('smokerun_career_score', Math.round(careerScore));
    G.newChars = CHARS.filter(c => c.unlock > before && c.unlock <= careerScore);
  }
  checkAch();
  toasts = [];
  G.newBest = G.score > bestOf();
  if (G.newBest) { bests[bestKey()] = Math.round(G.score); localStorage.setItem('smokerun_bests', JSON.stringify(bests)); }
  submitScore(G);
}

// ====== 繪圖工具 ======
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function txt(s, x, y, size, color, align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function txtS(s, x, y, size, color, align = 'center', stroke = 'rgba(0,0,0,.85)') {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = stroke;
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

// ====== 繪圖：場景 ======
function drawBg() {

  ctx.fillStyle = '#ddd';

}

const LABEL_Y = { cig: 18, pack: 30, cigar: 20, heat: 32, vape: 34, roll: 28 };

function drawHospital(o) {

  ctx.fillStyle = '#a5d8ff';

}

// 圓潤的 Q 版貓咪；戒癮喵會多一條綠領巾與禁菸小牌。
function drawCuteCat(x, y, s = 1, companion = false, phase = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const bob = Math.sin(phase) * 1.6;
  const fur = companion ? '#fff1c7' : '#f6ad55';
  const stripe = companion ? '#d68c45' : '#b86b24';

  // 尾巴、身體與小短腿
  ctx.strokeStyle = stripe; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12, 7 + bob); ctx.bezierCurveTo(28, 1 + bob, 26, -15 + bob, 18, -12 + bob); ctx.stroke();
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, 7 + bob, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff7e6';
  ctx.beginPath(); ctx.ellipse(-8, 17 + bob, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 17 + bob, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();

  // 大頭、立耳與耳朵內側
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.moveTo(-16, -13 + bob); ctx.lineTo(-12, -31 + bob); ctx.lineTo(-3, -20 + bob); ctx.lineTo(8, -31 + bob); ctx.lineTo(17, -12 + bob); ctx.closePath(); ctx.fill();
  circle(0, -10 + bob, 18);
  ctx.fillStyle = '#ffb3b3';
  ctx.beginPath(); ctx.moveTo(-13, -17 + bob); ctx.lineTo(-11, -27 + bob); ctx.lineTo(-6, -20 + bob); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -20 + bob); ctx.lineTo(8, -27 + bob); ctx.lineTo(13, -17 + bob); ctx.fill();

  // 虎斑、亮晶晶大眼與肉球鼻
  ctx.strokeStyle = stripe; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const dx of [-7, 0, 7]) { ctx.beginPath(); ctx.moveTo(dx, -26 + bob); ctx.lineTo(dx * .75, -20 + bob); ctx.stroke(); }
  ctx.fillStyle = '#30251f'; circle(-7, -11 + bob, 4); circle(7, -11 + bob, 4);
  ctx.fillStyle = '#fff'; circle(-8.2, -12.5 + bob, 1.5); circle(5.8, -12.5 + bob, 1.5);
  ctx.fillStyle = '#f783ac';
  ctx.beginPath(); ctx.moveTo(-2.5, -4 + bob); ctx.lineTo(2.5, -4 + bob); ctx.lineTo(0, -1 + bob); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6b3e2e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -1 + bob); ctx.quadraticCurveTo(-3, 3 + bob, -6, 0 + bob); ctx.moveTo(0, -1 + bob); ctx.quadraticCurveTo(3, 3 + bob, 6, 0 + bob); ctx.stroke();
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(side * 5, -2 + bob); ctx.lineTo(side * 18, -5 + bob); ctx.moveTo(side * 5, 1 + bob); ctx.lineTo(side * 18, 3 + bob); ctx.stroke();
  }

  if (companion) {
    // 會甩動的戒癮綠領巾
    ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 1 + bob, 13, .1, Math.PI - .1); ctx.stroke();
    ctx.fillStyle = '#40c057';
    ctx.beginPath(); ctx.moveTo(5, 4 + bob); ctx.lineTo(20 + Math.sin(phase * 1.7) * 3, 11 + bob); ctx.lineTo(9, 15 + bob); ctx.closePath(); ctx.fill();
    // 小小禁菸吊牌
    ctx.fillStyle = '#fff'; circle(-3, 5 + bob, 5.5);
    ctx.strokeStyle = '#e03131'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(-3, 5 + bob, 4.5, 0, Math.PI * 2); ctx.moveTo(-6, 2 + bob); ctx.lineTo(0, 8 + bob); ctx.stroke();
  }
  ctx.restore();
}

      ctx.fillStyle = '#ffd43b'; circle(0, -6, 6);

      ctx.fillStyle = '#fff3bf'; rr(-21, -15, 42, 30, 4); ctx.fill();

      ctx.beginPath(); ctx.ellipse(0, -12, 17, 4, 0, 0, Math.PI * 2); ctx.fill();
      circle(-21, -20 + Math.sin(t * 6) * 2, 3); circle(21, -18 + Math.cos(t * 6) * 2, 3);
      label('水桶', 30, '#9fd3ff');

      const shirts = ['#4dabf7', '#845ef7', '#20c997', '#ff922b'];

      ctx.fillStyle = 'rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0, 29, fleeing ? 18 : 13, 4, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = shirt; rr(-13, -11, 26, 25, 7); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-11, -5); ctx.lineTo(-19 - run * 4, 8);
      ctx.moveTo(11, -5); ctx.lineTo(19 + run * 4, 7);
      ctx.stroke();
      // 頭、髮型與表情
      ctx.fillStyle = '#f1c27d'; circle(0, -24, 12);
      ctx.fillStyle = '#3b2f2f';
      ctx.beginPath(); ctx.arc(0, -27, 12.5, Math.PI, 0); ctx.fill();
      if (Math.floor(seed) % 3 === 0) { ctx.fillRect(-12, -28, 24, 4); ctx.fillRect(-12, -28, 4, 8); }
      ctx.fillStyle = '#222';
      if (fleeing) {
        circle(-4.5, -24, 2.1); circle(4.5, -24, 2.1);
        ctx.fillStyle = '#7f1d1d'; ctx.beginPath(); ctx.ellipse(0, -17, 3.2, 4.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#74c0fc';
        ctx.beginPath(); ctx.moveTo(13, -32); ctx.quadraticCurveTo(19, -23, 13, -21); ctx.quadraticCurveTo(7, -23, 13, -32); ctx.fill();
        txtS('!', dir * -21, -43, 25, '#ff8787');
      } else {

        ctx.strokeStyle = '#7a3d2b'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, -19, 3, .15, Math.PI - .15); ctx.stroke();
      }
      ctx.restore();
      label(fleeing ? '逃離二手菸' : '路人', 38, fleeing ? '#e7f5ff' : '#dee2e6');
      break;
    }
    case 'inspector':
    case 'police': {
      const bob = Math.sin(t * 10 + x) * 2;
      if (type === 'police') {
        ctx.fillStyle = Math.floor(t * 6) % 2 ? '#ff3b3b' : '#3b82ff';

        ctx.shadowBlur = 0;

      ctx.font = `40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(type === 'police' ? '👮' : '🧑‍💼', 0, -6 + bob);
      const isP = type === 'police';
      ctx.fillStyle = isP ? '#1d4ed8' : '#15803d';

      txt(isP ? '警察' : '衛生局', 0, 27, 11, '#fff');
      break;
    }
    case 'tung': {
      const bob = Math.sin(t * 4) * 3;
      const g = ctx.createRadialGradient(0, -4, 6, 0, -4, 44);

      ctx.fillText('👩‍🏫', 0, -8 + bob);
      ctx.fillStyle = '#f08c00'; rr(-38, 18, 76, 19, 9); ctx.fill();
      txt('董氏基金會', 0, 28, 12, '#fff');
      break;
    }
  }
  if (ITEMS[type]) harmDots(type);
  ctx.restore();

// 肺葉輪廓、支氣管與葡萄串狀肺泡，讓傷害不再只是幾顆紅點。
function drawAlveoliLobe(side, damage) {
  const cx = side < 0 ? 43 : W - 43, cy = 365;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(side, 1);

  // 半透明肺葉外型
  ctx.fillStyle = `rgba(255,145,160,${.08 + damage * .12})`;
  ctx.strokeStyle = `rgba(255,185,195,${.28 + damage * .34})`;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(1, -77);
  ctx.bezierCurveTo(-24, -69, -35, -42, -34, -8);
  ctx.bezierCurveTo(-34, 31, -25, 69, -2, 76);
  ctx.bezierCurveTo(22, 80, 31, 52, 28, 24);
  ctx.bezierCurveTo(26, 2, 17, -17, 11, -37);
  ctx.bezierCurveTo(8, -51, 8, -68, 1, -77);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 氣管與分枝
  ctx.strokeStyle = `rgba(255,205,205,${.45 + damage * .3})`;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  const branches = [
    [[3,-79],[4,-48]], [[4,-48],[-13,-27]], [[4,-48],[16,-23]],
    [[-13,-27],[-20,-3]], [[-13,-27],[-24,-36]],
    [[16,-23],[20,2]], [[16,-23],[24,-35]],
    [[-20,-3],[-18,26]], [[20,2],[15,31]], [[-18,26],[-9,50]],
  ];
  for (const [[x1,y1],[x2,y2]] of branches) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

  // 每個分枝末端是一串像葡萄的肺泡。
  const clusters = [[-25,-39],[27,-38],[-26,2],[25,4],[-20,31],[17,34],[-7,55]];
  const bubbles = [[0,0],[-6,-3],[6,-3],[-4,5],[5,5]];
  const total = clusters.length * bubbles.length;
  const broken = Math.floor(damage * total);
  clusters.forEach(([gx, gy], ci) => bubbles.forEach(([dx, dy], bi) => {
    const idx = ci * bubbles.length + bi;
    const dead = idx < broken;
    const pulse = G.alveoliPop > 0 && idx === Math.max(0, broken - 1) ? G.alveoliPop : 0;
    const ax = gx + dx, ay = gy + dy, r = dead ? 3.3 : 4.7 + pulse * 2.5;
    ctx.fillStyle = dead ? `rgba(82,29,34,${.48 + damage * .34})` : `rgba(255,191,198,${.38 + damage * .28})`;
    ctx.beginPath(); ctx.ellipse(ax, ay, r, dead ? 2.2 : r, dead ? .35 : 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dead ? '#ff6b6b' : 'rgba(255,225,225,.72)'; ctx.lineWidth = dead ? 1.1 : .8; ctx.stroke();
    if (dead && idx % 3 === 0) {
      ctx.strokeStyle = 'rgba(255,120,120,.8)'; ctx.lineWidth = .9;
      ctx.beginPath(); ctx.moveTo(ax - 3, ay - 3); ctx.lineTo(ax, ay); ctx.lineTo(ax + 3, ay - 3); ctx.moveTo(ax, ay); ctx.lineTo(ax - 1, ay + 3); ctx.stroke();
    }
  }));

  if (G.alveoliPop > 0 && broken > 0) {
    const [bx, by] = clusters[Math.floor((broken - 1) / bubbles.length) % clusters.length];
    ctx.strokeStyle = `rgba(255,80,80,${G.alveoliPop})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by, 12 + (1 - G.alveoliPop) * 16, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  txtS('肺泡', cx, cy + 90, 11, damage > .55 ? '#ff8787' : '#ffc9c9');
}

// 肺損傷視覺：煙霧只沿著左右兩側緩慢累積，保留中央遊戲視野。
function drawLungSmoke() {
  const damage = clamp(G.lung / 100, 0, 1);
  if (damage <= 0) return;

  ctx.save();
  const edge = 46 + damage * 34;
  const left = ctx.createLinearGradient(0, 0, edge, 0);
  left.addColorStop(0, `rgba(35,37,40,${0.06 + damage * 0.13})`);
  left.addColorStop(1, 'rgba(35,37,40,0)');
  ctx.fillStyle = left; ctx.fillRect(0, 121, edge, H - 121);
  const right = ctx.createLinearGradient(W, 0, W - edge, 0);
  right.addColorStop(0, `rgba(35,37,40,${0.06 + damage * 0.13})`);
  right.addColorStop(1, 'rgba(35,37,40,0)');
  ctx.fillStyle = right; ctx.fillRect(W - edge, 121, edge, H - 121);

  const count = 4 + Math.floor(damage * 8);
  for (const side of [-1, 1]) {
    for (let i = 0; i < count; i++) {
      const cycle = (G.t * (0.018 + i * 0.0015) + i / count + (side > 0 ? 0.37 : 0)) % 1;
      const y = H + 70 - cycle * (H + 150);
      const drift = Math.sin(G.t * 0.35 + i * 1.83) * (7 + damage * 8);
      const x = side < 0 ? 10 + (i % 3) * 15 + drift : W - 10 - (i % 3) * 15 + drift;
      const r = 13 + (i % 4) * 5 + damage * 9;
      const fade = Math.sin(Math.PI * cycle);
      ctx.fillStyle = `rgba(75,77,79,${(0.018 + damage * 0.055) * fade})`;
      circle(x, y, r);
      ctx.fillStyle = `rgba(115,112,104,${(0.012 + damage * 0.035) * fade})`;
      circle(x - side * r * 0.35, y + r * 0.18, r * 0.72);
    }

  }
  drawAlveoliLobe(-1, damage);
  drawAlveoliLobe(1, damage);
  ctx.restore();

  if (damage > .28) txtS(`肺泡受損 ${Math.round(G.lung)}%`, W / 2, 158, 15, damage > .7 ? '#ff8787' : '#ffc9c9');
  if (damage > 0.82) txtS('⚠️ 肺損傷嚴重…別再抽了', W / 2, 190, 20, '#ff8787');
}

function drawWeedFX() {
  if (G.weed <= 0) return;
  const power = clamp(Math.min(1, G.weed / 1.2, (10 - G.weed) / .7), 0, 1);
  ctx.save();
  // 整個畫面先做強烈色相偏移，再疊上移動彩虹與脈衝波紋。
  ctx.globalCompositeOperation = 'color';
  ctx.fillStyle = `hsla(${(G.t * 105) % 360},100%,52%,${.42 * power})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 9; i++) {
    const y = ((i * 132 + G.t * 55) % (H + 160)) - 80;
    const hue = (G.t * 85 + i * 52) % 360;
    const g = ctx.createLinearGradient(0, y - 50, W, y + 50);
    g.addColorStop(0, `hsla(${hue},95%,55%,0)`);
    g.addColorStop(.5, `hsla(${hue},100%,60%,${.16 * power})`);
    g.addColorStop(1, `hsla(${(hue + 90) % 360},95%,55%,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, y - 55, W, 110);
  }
  for (let i = 0; i < 7; i++) {
    const r = 40 + ((G.t * (35 + i * 5) + i * 70) % 330);
    ctx.strokeStyle = `hsla(${(G.t * 110 + i * 70) % 360},100%,68%,${.24 * power * (1 - r / 420)})`;
    ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(W / 2 + Math.sin(G.t * 2 + i) * 24, H / 2, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'difference';
  ctx.globalAlpha = .09 * power;
  for (let y = 130; y < H; y += 52) {
    ctx.strokeStyle = `hsl(${(G.t * 140 + y) % 360},100%,65%)`; ctx.lineWidth = 12;
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 12) {
      const yy = y + Math.sin(x * .035 + G.t * 4 + y) * 12;
      x < 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
  txtS(`🌈 迷幻中：爽度、收入 ×2　${G.weed.toFixed(1)}s`, W / 2, 222, 17, `hsl(${(G.t * 120) % 360},100%,75%)`);
}

function drawPlayer() {
  const ti = G.tier ?? tierOf(G.money);
  const car = ti === 6 && G.good <= 0;
  if (G.catMode) { drawCatPlayer(ti); return; }
  // 富豪造型的金光，讓高階裝備在高速移動時仍看得出來
  if (ti >= 5 && G.good <= 0) {
    ctx.save();
    const glow = ctx.createRadialGradient(P.x, P.y - 6, 6, P.x, P.y - 6, car ? 58 : 42);
    glow.addColorStop(0, 'rgba(255,230,120,.3)');
    glow.addColorStop(1, 'rgba(255,212,59,0)');
    ctx.fillStyle = glow; circle(P.x, P.y - 6, car ? 58 : 42);
    ctx.fillStyle = '#ffe066';
    for (let i = 0; i < 3; i++) {
      const a = G.t * (1.8 + i * .25) + i * 2.1;

      const sx = P.x + Math.cos(a) * r, sy = P.y - 12 + Math.sin(a) * 24;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a); ctx.fillRect(-1, -5, 2, 10); ctx.fillRect(-5, -1, 10, 2); ctx.restore();
    }

  }
  if (car) drawCar(P.x, P.y, true);
  else {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(P.x, P.y + 28, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 乞丐：身上一團臭味
  if (ti === 0 && G.good <= 0) {
    ctx.strokeStyle = 'rgba(140,170,60,.55)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ox = P.x - 16 + i * 16, ph = G.t * 3 + i * 2;
      ctx.beginPath();
      for (let k = 0; k <= 10; k++) { const yy = P.y - 40 - k * 3, xx = ox + Math.sin(ph + k * 0.7) * 3; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }

    ctx.strokeStyle = '#495057'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(P.x - 24, P.y + 9, 10, 0, Math.PI); ctx.stroke();
    drawFlies(P.x, P.y);

}

function drawPlayerBody(ti = 3, car = false) {
  const x = P.x, y = P.y, wd = withdrawal(), b = breath();

      ctx.fillStyle = '#000'; ctx.fillRect(x - 11, y + 22 + sw * 4, 10, 4); ctx.fillRect(x + 1, y + 22 - sw * 4, 10, 4);

  }
  const SHIRT = { beggar: '#8a7f6a', ragged: '#9c8b70', shabby: '#a1887f', normal: '#8d6e63', suit: '#212529', tycoon: '#f8f9fa', car: '#f8f9fa' };
  if (good) {
    // 乖乖牌：白襯衫、紅領帶、背書包
    ctx.fillStyle = '#c0392b'; rr(x - 13, y - 14, 26, 22, 5); ctx.fill();
    ctx.fillStyle = '#fff'; rr(x - 17, y - 12, 34, 26, 8); ctx.fill();

    ctx.beginPath(); ctx.moveTo(x - 3, y - 11); ctx.lineTo(x + 3, y - 11); ctx.lineTo(x + 2, y + 6); ctx.lineTo(x, y + 9); ctx.lineTo(x - 2, y + 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
  } else {
    const c = SHIRT[tid];
    ctx.fillStyle = c; rr(x - 17, y - 12, 34, 26, 8); ctx.fill();
    if (tid === 'beggar' || tid === 'ragged') {
      // 破洞、補丁、鋸齒衣襬
      ctx.fillStyle = '#5c4f3c'; circle(x - 7, y - 2, 3); circle(x + 8, y + 5, 2.5);
      if (tid === 'beggar') { circle(x + 4, y - 6, 2); ctx.fillStyle = '#f1c27d'; circle(x - 7, y - 2, 1.8); }
      ctx.fillStyle = '#b5651d'; ctx.fillRect(x + 3, y - 9, 7, 6);
      ctx.strokeStyle = '#3d2b1f'; ctx.lineWidth = 1; ctx.strokeRect(x + 3, y - 9, 7, 6);
      ctx.fillStyle = '#5d6168';
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x - 17 + i * 7, y + 14); ctx.lineTo(x - 13.5 + i * 7, y + 9); ctx.lineTo(x - 10 + i * 7, y + 14); ctx.fill(); }
    } else if (tid === 'shabby') {
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x - 1, y - 11, 2, 24);

    } else if (tid === 'normal') {
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x - 1, y - 11, 2, 24);
    } else if (tid === 'suit') {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 6, y - 12); ctx.lineTo(x + 6, y - 12); ctx.lineTo(x, y + 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1c7ed6'; ctx.beginPath(); ctx.moveTo(x - 2, y - 10); ctx.lineTo(x + 2, y - 10); ctx.lineTo(x + 1.5, y + 2); ctx.lineTo(x - 1.5, y + 2); ctx.closePath(); ctx.fill();
    } else {
      // 土豪：白西裝、紅花襯衫、大金鍊
      ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.moveTo(x - 7, y - 12); ctx.lineTo(x + 7, y - 12); ctx.lineTo(x, y + 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y - 10, 9, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = '#ffd43b'; circle(x, y + 1, 4);
      txt('$', x, y + 1, 6, '#a07900');
    }
    ctx.fillStyle = c;
  }
  if (car) {
    // 開車：一手扶方向盤、一手伸出窗外比讚
    ctx.fillRect(x - 22, y - 6, 6, 12);
    ctx.save(); ctx.translate(x + 19, y - 6); ctx.rotate(-0.9); ctx.fillRect(-3, -16, 6, 16); ctx.restore();
    ctx.fillStyle = '#f1c27d'; circle(x + 32, y - 15, 4);
  } else {
    ctx.fillRect(x - 22, y - 8 - sw * 3, 6, 18);
    ctx.fillRect(x + 16, y - 8 + sw * 3, 6, 18);

  // 土豪以上：手錶
  if (!good && ti >= 5 && !car) { ctx.fillStyle = '#ffd43b'; ctx.fillRect(x + 15, y + 4 + sw * 3, 8, 3); }
  // 頭（喪屍化時變綠）
  ctx.fillStyle = G.zombie > 0 ? '#8fbf6a' : b > 0.5 ? '#e3d9c6' : '#f1c27d'; circle(x, y - 24, 13);
  // 臉色發白、發紫
  if (b > 0 && G.zombie <= 0) { ctx.fillStyle = `rgba(120,140,200,${b * 0.35})`; circle(x, y - 24, 13); }
  ctx.fillStyle = '#3b2f2f';
  if (good) {
    // 整齊的西瓜皮
    ctx.beginPath(); ctx.arc(x, y - 25, 14, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 14, y - 26, 28, 4);
  } else if (tid === 'beggar' || tid === 'ragged') {
    // 亂髮、滿臉鬍渣、臉髒髒
    ctx.fillStyle = '#4a3b2f';
    ctx.beginPath(); ctx.arc(x, y - 26, 14, Math.PI * 1.0, Math.PI * 2.0); ctx.fill();
    for (let i = 0; i < 7; i++) { const a = Math.PI * (1.05 + i * 0.13); ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 12, y - 26 + Math.sin(a) * 12); ctx.lineTo(x + Math.cos(a) * 19, y - 26 + Math.sin(a) * 18 + (i % 2) * 3); ctx.lineTo(x + Math.cos(a + 0.12) * 12, y - 26 + Math.sin(a + 0.12) * 12); ctx.fill(); }
    ctx.fillStyle = 'rgba(70,55,40,.55)';
    ctx.beginPath(); ctx.ellipse(x, y - 15, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(90,70,50,.3)'; circle(x - 8, y - 21, 2.5); circle(x + 9, y - 27, 2);
  } else if (tid === 'tycoon' || tid === 'car') {
    // 油頭
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(x, y - 26, 13.5, Math.PI * 1.0, Math.PI * 2.0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x - 4, y - 34, 6, 2, -0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x, y - 26, 13.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    if (tid !== 'suit') {
      ctx.fillStyle = 'rgba(80,60,50,.35)';
      ctx.beginPath(); ctx.ellipse(x, y - 15, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 初始角色特徵（身家造型改變時仍會保留）。
  if (!good && G.char === 'young') {
    ctx.fillStyle = '#228be6';
    ctx.beginPath(); ctx.arc(x, y - 29, 14, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 15, y - 30, 30, 4); ctx.fillRect(x + 8, y - 28, 11, 3);
  } else if (!good && G.char === 'elder') {
    ctx.fillStyle = '#e9ecef';
    ctx.beginPath(); ctx.arc(x, y - 27, 14, Math.PI * 1.03, Math.PI * 1.97); ctx.fill();
    ctx.fillStyle = '#adb5bd'; circle(x - 11, y - 20, 4); circle(x + 11, y - 20, 4);
  } else if (!good && G.char === 'punk') {
    // 阿志頭：兩側推高、頂部厚、瀏海切成一條俐落直線。
    const punkSkin = G.zombie > 0 ? '#8fbf6a' : b > .5 ? '#e3d9c6' : '#f1c27d';
    // 先把一般髮型的兩側蓋回膚色，做出 high fade。
    ctx.fillStyle = punkSkin;
    ctx.beginPath(); ctx.ellipse(x - 11.5, y - 30, 4.5, 8, -.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 11.5, y - 30, 4.5, 8, .08, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#171717';
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 38);
    ctx.quadraticCurveTo(x, y - 44, x + 11, y - 38);
    ctx.quadraticCurveTo(x + 15, y - 35, x + 12, y - 29);
    ctx.lineTo(x - 12, y - 29);
    ctx.quadraticCurveTo(x - 15, y - 34, x - 11, y - 38);
    ctx.closePath(); ctx.fill();
    // 平直瀏海是這個髮型最明顯的特徵。
    ctx.strokeStyle = '#050505'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x - 12, y - 29); ctx.lineTo(x + 12, y - 29); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - 6, y - 39); ctx.quadraticCurveTo(x + 1, y - 42, x + 8, y - 38); ctx.stroke();
    // 推高兩側留下很淡的漸層線與耳環。
    ctx.strokeStyle = 'rgba(50,35,25,.28)'; ctx.lineWidth = 1;
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(x + sx * 11, y - 34); ctx.lineTo(x + sx * 12, y - 27); ctx.stroke();
    }
    ctx.fillStyle = '#ffd43b'; circle(x + 13, y - 19, 2.1);
  }
  // 眼睛
  ctx.fillStyle = '#222';
  if (good) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2;
    for (const ex of [x - 5, x + 5]) { ctx.fillStyle = '#222'; circle(ex, y - 20, 2); ctx.beginPath(); ctx.arc(ex, y - 20, 4.5, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x - 0.5, y - 20); ctx.lineTo(x + 0.5, y - 20); ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,120,.5)'; circle(x - 9, y - 15, 2.5); circle(x + 9, y - 15, 2.5);
    ctx.strokeStyle = '#a33'; ctx.beginPath(); ctx.arc(x, y - 16, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  } else if (G.zombie > 0) {
    ctx.fillStyle = '#fff'; circle(x - 5, y - 25, 3.2); circle(x + 5, y - 25, 3.2);
    ctx.fillStyle = '#c92a2a'; circle(x - 5 + Math.sin(G.t * 9) * 1.2, y - 25, 1.2); circle(x + 5 - Math.sin(G.t * 9) * 1.2, y - 25, 1.2);
  } else if (wd > 0.5) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    for (const ex of [x - 5, x + 5]) {
      ctx.beginPath(); ctx.moveTo(ex - 2.5, y - 27); ctx.lineTo(ex + 2.5, y - 23); ctx.moveTo(ex + 2.5, y - 27); ctx.lineTo(ex - 2.5, y - 23); ctx.stroke();
    }
  } else if (G.nic > 70) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.8;
    for (const ex of [x - 5, x + 5]) { ctx.beginPath(); ctx.arc(ex, y - 24, 2.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else {
    circle(x - 5, y - 25, 1.8); circle(x + 5, y - 25, 1.8);
  }
  if (!good && G.char === 'elder' && G.zombie <= 0) {
    ctx.strokeStyle = '#495057'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x - 5, y - 24, 5, 0, Math.PI * 2); ctx.arc(x + 5, y - 24, 5, 0, Math.PI * 2); ctx.moveTo(x, y - 24); ctx.lineTo(x, y - 24); ctx.stroke();
  }
  // 土豪以上：墨鏡
  if (!good && ti >= 5 && G.zombie <= 0) {
    ctx.fillStyle = '#111'; rr(x - 11, y - 29, 9, 7, 3); ctx.fill(); rr(x + 2, y - 29, 9, 7, 3); ctx.fill();
    ctx.fillRect(x - 2, y - 27, 4, 2);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x - 9, y - 28, 3, 2); ctx.fillRect(x + 4, y - 28, 3, 2);
  }
  // 喘氣時張大嘴、菸掉在嘴角
  if (b > 0.3 && !good) {
    const open = 2 + Math.abs(Math.sin(G.t * (6 + b * 6))) * 3 * b;
    ctx.fillStyle = '#5a1a1a'; ctx.beginPath(); ctx.ellipse(x, y - 16, 3.5, open, 0, 0, Math.PI * 2); ctx.fill();
  } else if (G.nic > 0 && !good) {
    if (ti >= 5) {
      // 有錢人改叼雪茄
      ctx.fillStyle = '#6b3e1f'; rr(x + 3, y - 20, 18, 5, 2.5); ctx.fill();
      ctx.fillStyle = '#d4a017'; ctx.fillRect(x + 8, y - 20, 3, 5);
      ctx.fillStyle = '#ff5a1f'; ctx.fillRect(x + 20, y - 20, 2, 5);
    } else {
      // 窮的時候抽菸屁股
      const len = ti <= 1 ? 6 : 14;
      ctx.fillStyle = '#fafaf5'; ctx.fillRect(x + 4, y - 19, len, 3);
      ctx.fillStyle = '#ff5a1f'; ctx.fillRect(x + 3 + len, y - 19, 3, 3);

  // 冒汗
  if (b > 0 && !good) {
    ctx.fillStyle = '#74c0fc';
    for (const [dx, ph] of [[-15, 0], [15, 1.7]]) {
      const dy = ((G.t * 1.5 + ph) % 1) * 10;
      ctx.beginPath(); ctx.moveTo(x + dx, y - 34 + dy); ctx.quadraticCurveTo(x + dx + 4, y - 27 + dy, x + dx, y - 25 + dy); ctx.quadraticCurveTo(x + dx - 4, y - 27 + dy, x + dx, y - 34 + dy); ctx.fill();
    }
  }
  if (wd > 0 && !good) {
    ctx.fillStyle = '#74c0fc';
    ctx.beginPath(); ctx.moveTo(x + 13, y - 40); ctx.quadraticCurveTo(x + 18, y - 32, x + 13, y - 30); ctx.quadraticCurveTo(x + 8, y - 32, x + 13, y - 40); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  const wd = withdrawal();
  ctx.save();
  let sx = 0, sy = 0;
  if (state === 'play') {
    if (G.shake > 0) { sx += rand(-6, 6) * G.shake / 0.4; sy += rand(-6, 6) * G.shake / 0.4; }
    if (wd > 0) { sx += rand(-1, 1) * wd * 4; sy += rand(-1, 1) * wd * 4; }
  }
  ctx.translate(sx, sy);
  drawBg();
  for (const o of G.objs) if (o.type === 'zone') drawZone(o);
  for (const o of G.objs) if (o.type === 'room' && !(G.trap && G.trap.o === o)) drawRoom(o);
  for (const o of G.objs) if (o.type === 'hosp') drawHospital(o);
  for (const o of G.objs) if (o.type === 'gate') drawGate(o);
  for (const o of G.objs) if (o.kind) drawItem(o.type, o.x, o.y, 1, o);
  drawPlayer();
  if (G.trap) drawRoom(G.trap.o);
  for (const p of G.parts) {
    if (p.bill) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = '#69db7c'; ctx.fillRect(-9, -5, 18, 10);
      ctx.strokeStyle = '#2b8a3e'; ctx.lineWidth = 1.2; ctx.strokeRect(-9, -5, 18, 10);
      ctx.fillStyle = '#2b8a3e'; circle(0, 0, 2.5);
      ctx.restore();
      continue;
    }
    ctx.fillStyle = `rgba(${p.c},${(p.life / p.max) * 0.6})`;
    circle(p.x, p.y, p.r);
  }
  for (const p of G.pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    txtS(p.text, p.x, p.y, p.size, p.color);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 戒斷畫面
  if (wd > 0) {
    ctx.fillStyle = `rgba(50,50,60,${wd * 0.45})`;
    ctx.fillRect(0, 0, W, H);
    txtS('戒斷中……手在抖', W / 2 + rand(-2, 2) * wd, 135, 22, '#ffb3b3');
  }
  if (G.quitT > 4) {
    ctx.globalAlpha = Math.min(1, (G.quitT - 4) / 2);
    txtS(G.quitT > 10 ? '再撐一下下……' : '……咦？好像，沒那麼想抽了？', W / 2, 170, 18, '#c3fae8');
    ctx.globalAlpha = 1;
  }
  drawLungSmoke();
  drawWeedFX();
  if (G.zombie > 0) {
    const a = 0.16 + Math.sin(now() * 6) * 0.06;
    ctx.fillStyle = `rgba(60,160,60,${a})`;
    ctx.fillRect(0, 0, W, H);
    txtS(`🧟 喪屍化！操作左右顛倒 ${G.zombie.toFixed(1)}s`, W / 2 + Math.sin(now() * 13) * 4, 150, 18, '#b2f2bb');
  }
  if (G.good > 0) {
    ctx.fillStyle = `rgba(255,236,150,${0.12 + Math.sin(now() * 3) * 0.04})`;
    ctx.fillRect(0, 0, W, H);
    txtS(`😇 懂事模式：不想抽菸 ${G.good.toFixed(1)}s`, W / 2, 150, 18, '#fff3bf');
  }
  if (G.inZone && !G.trap) txtS('⚠️ 禁菸區：在這裡抽菸會被罰！', W / 2, 115, 16, '#ffadad');
  if (G.wanted > 0 && Math.floor(now() * 4) % 2) txtS('🚨 通緝中 🚨', W - 70, 115, 16, '#ff6b6b');

  if (G.trap) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(45, 260, W - 90, 130, 16); ctx.fill();
    txtS('被關在吸菸室了！', W / 2, 292, 24, '#ffd23f');
    txt('好舒服～ 但動不了', W / 2, 322, 15, '#ddd', 'center', 'normal');
    txtS('狂點畫面／連按空白鍵 逃出！', W / 2, 348, 16, '#fff');
    ctx.fillStyle = '#333'; rr(80, 366, W - 160, 12, 6); ctx.fill();
    ctx.fillStyle = '#8ce99a'; rr(80, 366, Math.max(12, (W - 160) * G.trap.taps / G.trap.need), 12, 6); ctx.fill();
  }
}

function bar(x, y, name, v, color, blink) {
  txt(name, x, y + 8, 13, '#ddd', 'left');
  const bx = x + 56, bw = W - bx - 14, bh = 16;
  ctx.fillStyle = '#333'; rr(bx, y, bw, bh, 8); ctx.fill();
  if (v > 0) {
    ctx.fillStyle = blink && Math.floor(now() * 6) % 2 ? '#fff' : color;

function drawHUD() {
  ctx.fillStyle = 'rgba(15,15,20,.75)';
  ctx.fillRect(0, 0, W, 94);
  txt(`😎 爽度 ${fmt(G.score)}`, 14, 20, 18, '#ffd166', 'left');
  txt(`${CHARS[charIdx].icon}${D.name} · 速度 Lv.${G.speedLv + 1}`, W / 2 + 10, 20, 12, G.speedLv >= 5 ? '#ffe066' : '#aaa');
  const ti = tierOf(G.money);
  txt(`${TIERS[ti].icon} $${fmt(G.money)}`, W - 14, 20, 18, ti <= 1 ? '#ff6b6b' : ti >= 4 ? '#ffd43b' : '#8ce99a', 'right');
  bar(14, 40, '尼古丁', G.nic / 100, '#ff9f1c', G.nic < 20);
  bar(14, 66, '肺損傷', G.lung / 100, '#c1121f', G.lung > 75);
  // 永久疤痕（深色、無法恢復）
  const bx = 70, bw = W - bx - 14;
  if (G.scar > 0.5) {
    ctx.fillStyle = '#4a0a0f'; rr(bx, 66, Math.max(16, bw * G.scar / 100), 16, 8); ctx.fill();
  }
  const healing = G.sinceSmoke > CFG.lungDelay && G.lung > G.scar + 0.1;
  if (healing) txt('▼ 恢復中', bx + bw - 44, 74, 11, '#8ce99a', 'right');
  else if (G.chain >= 2 && G.sinceSmoke < CFG.chainWindow) txt(`🔗連抽×${G.chain}`, bx + bw - 44, 74, 11, '#ffa8a8', 'right');

  // 身家造型進度：把「錢會改變外觀」直接呈現在遊戲 UI 中
  if (!G.tut) {
    const T = TIERS[ti], next = TIERS[ti + 1];
    const pulse = G.tierT > 0 ? 0.08 + Math.sin(now() * 7) * 0.04 : 0;
    ctx.fillStyle = `rgba(15,15,20,${0.78 + pulse})`; ctx.fillRect(0, 94, W, 27);
    txt(`造型 ${T.icon} ${T.name}`, 14, 107, 13, ti >= 4 ? '#ffe066' : ti <= 1 ? '#ffa8a8' : '#e9ecef', 'left');
    if (next) txt(`再 $${fmt(Math.max(0, next.min - G.money))} → ${next.icon}${next.name}`, W - 14, 107, 12, '#ced4da', 'right', 'normal');
    else txt('已達最高級', W - 14, 107, 12, '#ffe066', 'right');
    ctx.fillStyle = '#343a40'; ctx.fillRect(0, 118, W, 3);
    ctx.fillStyle = ti >= 4 ? '#ffd43b' : ti <= 1 ? '#ff8787' : '#69db7c';
    ctx.fillRect(0, 118, W * tierProgress(G.money, ti), 3);
  }
  if (state === 'play') btn(8, 128, 42, 34, 'Ⅱ', '#495057', pauseGame, 17);
  if (G.catMode) txtS(`😺 戒癮喵 · 🐾${G.catTotal}`, 58, 145, 12, '#b2f2bb', 'left');
  if (G.inZone) txtS(`🚭 無菸挑戰 · 連續 ${G.cleanStreak}`, W / 2, 142, 14, '#ffe066');
}

// ====== UI 元件 ======
function panel(x, y, w, h, fill = '#fffaf0', border = '#2b2b2b') {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(x + 4, y + 6, w, h, 18); ctx.fill();
  ctx.fillStyle = fill; rr(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 3; ctx.stroke();
}

function btn(x, y, w, h, label, color, fn, size = 20, textColor = '#fff') {
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(x, y + 4, w, h, h / 2); ctx.fill();
  ctx.fillStyle = color; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x + 6, y + 4, w - 12, h / 2 - 4, h / 4); ctx.fill();
  txt(label, x + w / 2, y + h / 2 + 1, size, textColor);
  if (fn) button(x, y, w, h, fn);
}

function emoji(s, x, y, size) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(s, x, y);
}

function wrapText(s, maxW, size, weight = 'normal') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const out = []; let line = '';
  for (const ch of s) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}

// 成就徽章卡片
function achCard(a, x, y, w, h, done, isNew) {

  ctx.strokeStyle = done ? rank.color : '#c8c8c8'; ctx.lineWidth = done ? 3 : 2; ctx.stroke();
  const cx = x + 36, cy = y + h / 2;
